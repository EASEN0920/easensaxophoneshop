<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- 強制瀏覽器使用 UTF-8 編碼，防止 GitHub Pages 出現亂碼 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.K. SAXOPHONE | 傳承八十載的台灣匠心</title>
    
    <!-- 載入外部資源 (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- 載入 Firebase SDK (Compat 版本) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100;300;400;700;900&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            overflow-x: hidden; 
            background-color: #fafaf9;
        }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        /* 捲軸美化 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f5f5f4; }
        ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
        .sidebar-transition { transition: transform 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 1. Firebase 初始化配置 ---
        const firebaseConfig = {
            apiKey: "AIzaSyCLedFsORsopOzUhtto5kr8WfEnM28Bh8k",
            authDomain: "tk-saxophone.firebaseapp.com",
            projectId: "tk-saxophone",
            storageBucket: "tk-saxophone.firebasestorage.app",
            messagingSenderId: "64364188077",
            appId: "1:64364188077:web:774938ea6f09f351c39124",
            measurementId: "G-VT59B60JMH"
        };
        const appId = 'tk-saxophone-web';

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- 2. Shopify 自動同步配置 ---
        const SHOPIFY_DOMAIN = 'tk-saxophone.myshopify.com';
        const SHOPIFY_TOKEN = '6992f8d32d2f2b395e09519c2760f80f';

        // --- 3. 穩定版圖示組件 ---
        const LucideIcon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    const iconName = name.charAt(0).toLowerCase() + name.slice(1).replace(/[A-Z]/g, letter => `-${letter.toLowerCase()}`);
                    iconRef.current.setAttribute('data-lucide', iconName);
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i ref={iconRef} style={{ width: size, height: size, display: 'inline-block' }} className={className}></i>;
        };

        // --- 4. 政策頁面組件 ---

        const ShippingPolicyPage = () => (
            <div className="max-w-4xl mx-auto px-6 py-24 animate-fade-in">
                <div className="mb-16 text-center">
                    <h2 className="text-4xl font-black italic mb-4 text-stone-900">運送政策 Shipping Policy</h2>
                    <div className="w-16 h-1 bg-amber-500 mx-auto"></div>
                </div>
                <div className="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-sm border border-stone-100 space-y-12 text-left">
                    <section>
                        <h3 className="text-xl font-bold text-stone-900 mb-6 flex items-center gap-2">
                            <LucideIcon name="Calculator" className="text-amber-600" /> 運費計算
                        </h3>
                        <div className="space-y-4 text-stone-600 leading-relaxed font-light">
                            <p><span className="font-bold text-stone-900">一般配件與耗材：</span> 於 TK SAXOPHONE 官網購買之配件、耗材類商品，依系統標示之基本運費計算（如 7-11 交貨便或宅配基本資費）。</p>
                            <p><span className="font-bold text-stone-900">樂器類商品：</span> 由於薩克斯風屬於精密儀器且單價較高，樂器類商品限於「一中旗艦店」現場訂購或聯繫客服專人購買。其運費將依據最終配送方式（專車或指定專業物流）實報實銷。</p>
                        </div>
                    </section>

                    <section>
                        <h3 className="text-xl font-bold text-stone-900 mb-6 flex items-center gap-2">
                            <LucideIcon name="Truck" className="text-amber-600" /> 商品出貨與運送須知
                        </h3>
                        <div className="space-y-6 text-stone-600 leading-relaxed font-light">
                            <div>
                                <h4 className="font-bold text-stone-800 mb-2">送貨方式</h4>
                                <ul className="list-disc pl-5 space-y-2">
                                    <li><span className="font-bold text-stone-900">一般配送：</span> 小件商品、配件或清潔用品，提供 7-11 交貨便 或 一般宅配 服務。</li>
                                    <li><span className="font-bold text-stone-900">精密樂器配送：</span> 為確保精密樂器之音準與管體結構完整，樂器類商品不提供自動化物流下單。凡訂購樂器，將由專人聯繫並約定配送時間。我們將配合專業精密儀器貨運或專車配送，確保樂器在避震與控溫環境下送達。</li>
                                    <li><span className="font-bold text-amber-600 italic">門市取貨（推薦）：</span> 建議您至 「TK SAXOPHONE 一中旗艦店」 現場取貨。現場將由專業技師為您進行最後的音程校正，並提供使用與保養之專業指導。</li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="font-bold text-stone-800 mb-2">送貨天數</h4>
                                <ul className="list-disc pl-5 space-y-2">
                                    <li><span className="font-bold text-stone-900">現貨配件：</span> 訂單付款完成後，將於 3 到 7 個工作天內（不含例假日）運送到指定地點。</li>
                                    <li><span className="font-bold text-stone-900">樂器類商品：</span> 經現場或專人訂購後，需預留 5-10 個技師檢整工作日，具體配送日期由專人聯繫約定為準。</li>
                                    <li><span className="font-bold text-stone-900">不可抗力因素：</span> 如遇天災、戰爭、疫情或極端氣候（可能影響精密樂器存放環境）等不可抗力之因素，出貨日期將順延。</li>
                                </ul>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        );

        const ReturnPolicyPage = () => (
            <div className="max-w-4xl mx-auto px-6 py-24 animate-fade-in">
                <div className="mb-16 text-center">
                    <h2 className="text-4xl font-black italic mb-4 text-stone-900">退換貨政策 Return Policy</h2>
                    <div className="w-16 h-1 bg-amber-500 mx-auto"></div>
                </div>
                <div className="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-sm border border-stone-100 space-y-12 text-left">
                    <section>
                        <h3 className="text-xl font-bold text-stone-900 mb-6 flex items-center gap-2">
                            <LucideIcon name="ShieldCheck" className="text-amber-600" /> 一、七天鑑賞期與開箱存證
                        </h3>
                        <div className="space-y-4 text-stone-600 leading-relaxed font-light">
                            <p>於 TK SAXOPHONE 官方網站購買之商品，均享有商品到貨次日起七天內之鑑賞期（非試用期）。</p>
                            <div className="bg-amber-50 border-l-4 border-amber-500 p-4 italic text-amber-900">
                                <span className="font-black">【重要提醒】</span> 為保障雙方權益，請您在拆封包裹時全程錄影。影像需清楚包含「未拆封原狀」、「拆封過程」以及「商品本體檢查」。
                            </div>
                            <p>若商品有瑕疵、損壞或品項不符，退換貨申請皆需提供原始開箱錄影影像作為證明；若無錄影存證，恕難受理相關爭議。</p>
                        </div>
                    </section>

                    <section>
                        <h3 className="text-xl font-bold text-stone-900 mb-6 flex items-center gap-2">
                            <LucideIcon name="PackageX" className="text-amber-600" /> 二、退貨條件
                        </h3>
                        <div className="space-y-4 text-stone-600 leading-relaxed font-light">
                            <p>退回商品需保持全新狀態，並包含原始完整包裝（含商品本體、保證書、配件、贈品、原廠包裝及所有隨附文件）。</p>
                            <p><span className="font-bold text-stone-900">衛生用品限制：</span> 吹嘴、竹片、清潔布等個人衛生類配件，一經拆封後，除瑕疵外恕不接受退換。</p>
                            <p><span className="font-bold text-stone-900">人為損毀：</span> 若商品因拆卸、碰撞、受潮、刮傷或人為因素損壞，需視損壞程度扣除回復原狀之必要費用。</p>
                        </div>
                    </section>

                    <section>
                        <h3 className="text-xl font-bold text-stone-900 mb-6 flex items-center gap-2">
                            <LucideIcon name="RefreshCw" className="text-amber-600" /> 三、換貨處理
                        </h3>
                        <p className="text-stone-600 font-light">若您收到的商品有瑕疵或與訂單不符，請於收到商品三日內聯繫客服並提供錄影檔，我們將優先為您辦理免費更換新品。</p>
                    </section>

                    <section>
                        <h3 className="text-xl font-bold text-stone-900 mb-6 flex items-center gap-2">
                            <LucideIcon name="Coins" className="text-amber-600" /> 四、退款說明
                        </h3>
                        <div className="space-y-4 text-stone-600 leading-relaxed font-light">
                            <p>我們在收到退貨商品並確認無誤後，將於 7-10 個工作天內依原付款方式完成退款。</p>
                            <p>若訂單中含有贈品，退貨時需一併退回；若未退回，將從退款金額中扣除贈品之原價。</p>
                        </div>
                    </section>
                </div>
            </div>
        );

        // --- 5. 主程式組件 ---

        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [user, setUser] = useState(null);
            const [shopifyProducts, setShopifyProducts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [adminClickCount, setAdminClickCount] = useState(0);
            const [showAdmin, setShowAdmin] = useState(false);

            useEffect(() => {
                const initAuth = async () => {
                    try { await firebase.auth().signInAnonymously(); } catch (error) {}
                };
                initAuth();
                const unsubscribe = firebase.auth().onAuthStateChanged(setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                const fetchShopify = async () => {
                    const gqlQuery = `{ products(first: 20) { edges { node { id title handle priceRange { minVariantPrice { amount } } images(first: 1) { edges { node { url } } } } } } }`;
                    try {
                        const response = await fetch(`https://${SHOPIFY_DOMAIN}/api/2024-01/graphql.json`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'X-Shopify-Storefront-Access-Token': SHOPIFY_TOKEN },
                            body: JSON.stringify({ query: gqlQuery }),
                        });
                        const result = await response.json();
                        if (result.data) {
                            const items = result.data.products.edges.map(edge => ({
                                id: edge.node.id,
                                name: edge.node.title,
                                price: edge.node.priceRange.minVariantPrice.amount,
                                img: edge.node.images.edges[0]?.node.url || 'https://i.imgur.com/f3sTY2J.jpeg',
                                url: `https://${SHOPIFY_DOMAIN}/products/${edge.node.handle}`,
                                hidePrice: edge.node.title.includes('傳奇') || edge.node.title.includes('雅柏')
                            }));
                            setShopifyProducts(items);
                        }
                    } catch (err) {} finally { setLoading(false); }
                };
                if (SHOPIFY_TOKEN) fetchShopify();
            }, []);

            const changePage = (page) => {
                setCurrentPage(page);
                setIsSidebarOpen(false);
                window.scrollTo(0, 0);
            };

            const handleAdminTrigger = () => {
                const newCount = adminClickCount + 1;
                setAdminClickCount(newCount);
                if (newCount >= 3) { setShowAdmin(true); setAdminClickCount(0); }
            };

            return (
                <div className="min-h-screen bg-stone-50 text-stone-900 font-sans text-left flex flex-col">
                    {isSidebarOpen && <div className="fixed inset-0 bg-black/60 z-[60] md:hidden backdrop-blur-sm" onClick={() => setIsSidebarOpen(false)}></div>}

                    <aside className={`fixed top-0 right-0 h-full w-72 bg-stone-900 z-[70] shadow-2xl md:hidden sidebar-transition transform ${isSidebarOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                        <div className="flex flex-col h-full p-8">
                            <div className="flex justify-between items-center mb-12 text-left">
                                <span className="text-amber-500 font-bold tracking-widest uppercase italic">選單</span>
                                <button onClick={() => setIsSidebarOpen(false)} className="text-stone-400 hover:text-white"><LucideIcon name="X" size={28} /></button>
                            </div>
                            <nav className="flex flex-col space-y-6 text-left">
                                {['home', 'about', 'products', 'service'].map((page) => (
                                    <button 
                                        key={page}
                                        onClick={() => changePage(page)} 
                                        className={`text-xl font-bold tracking-widest uppercase text-left ${currentPage === page ? 'text-amber-500' : 'text-stone-300'}`}
                                    >
                                        {page === 'home' ? '首頁' : page === 'about' ? '品牌簡介' : page === 'products' ? '產品系列' : '售後服務'}
                                    </button>
                                ))}
                                <div className="pt-8 border-t border-stone-800 text-left">
                                    <button onClick={() => changePage('shipping')} className="text-stone-400 text-sm mb-4 block uppercase font-bold tracking-widest">運送政策</button>
                                    <button onClick={() => changePage('return')} className="text-stone-400 text-sm block uppercase font-bold tracking-widest">退換貨政策</button>
                                </div>
                            </nav>
                        </div>
                    </aside>

                    <nav className="fixed w-full z-50 bg-stone-900/95 text-white backdrop-blur-md border-b border-stone-800 shadow-xl">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
                            <div className="flex items-center gap-4 cursor-pointer" onClick={() => changePage('home')}>
                                <img src="https://i.imgur.com/H7NWyZP.png" alt="TK Logo" className="h-10 w-auto" />
                                <div className="flex flex-col border-l border-stone-700 pl-4 leading-tight text-left">
                                    <span className="text-lg md:text-xl font-bold tracking-widest text-amber-500 italic leading-none uppercase">TK SAXOPHONE</span>
                                    <span className="text-[9px] tracking-[0.2em] text-stone-400 font-bold uppercase mt-1">100% 台灣製造</span>
                                </div>
                            </div>
                            <div className="hidden md:flex space-x-12 text-base font-bold tracking-widest uppercase">
                                <button onClick={() => changePage('home')} className={currentPage === 'home' ? 'text-amber-500' : 'hover:text-stone-300 transition'}>首頁</button>
                                <button onClick={() => changePage('about')} className={currentPage === 'about' ? 'text-amber-500' : 'hover:text-stone-300 transition'}>品牌簡介</button>
                                <button onClick={() => changePage('products')} className={currentPage === 'products' ? 'text-amber-500' : 'hover:text-stone-300 transition'}>產品系列</button>
                                <button onClick={() => changePage('service')} className={currentPage === 'service' ? 'text-amber-500' : 'hover:text-stone-300 transition'}>售後服務</button>
                            </div>
                            <div className="flex items-center gap-4">
                                <a href={`https://${SHOPIFY_DOMAIN}`} target="_blank" className="hidden md:flex bg-amber-600 hover:bg-amber-700 p-3 rounded-full font-black text-white text-sm shadow-lg">
                                    <LucideIcon name="ShoppingCart" size={18} /> <span className="ml-2 uppercase tracking-widest text-[10px]">進入商城</span>
                                </a>
                                <button onClick={() => setIsSidebarOpen(true)} className="md:hidden p-2 text-stone-400"><LucideIcon name="Menu" size={28} /></button>
                                {showAdmin && <button onClick={() => changePage('admin')} className="p-2 bg-stone-700 rounded-full text-amber-500 animate-pulse"><LucideIcon name="Settings" size={20} /></button>}
                            </div>
                        </div>
                    </nav>

                    <main className="pt-20 flex-1">
                        {currentPage === 'home' && <HomePage onExplore={() => changePage('products')} />}
                        {currentPage === 'about' && <AboutSection />}
                        {currentPage === 'products' && <ProductsPage products={shopifyProducts} loading={loading} />}
                        {currentPage === 'service' && <ServicePage />}
                        {currentPage === 'shipping' && <ShippingPolicyPage />}
                        {currentPage === 'return' && <ReturnPolicyPage />}
                        {currentPage === 'admin' && <AdminPanel onClose={() => changePage('home')} />}
                    </main>

                    <footer className="bg-stone-950 text-stone-500 py-16 mt-auto">
                        <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12 text-left">
                            <div className="lg:col-span-1">
                                <div className="flex items-center gap-4 mb-6">
                                    <img src="https://i.imgur.com/H7NWyZP.png" alt="Logo" className="h-8 opacity-90" />
                                    <span className="text-xl font-bold tracking-widest text-white italic uppercase">TK SAXOPHONE</span>
                                </div>
                                <p className="text-sm max-w-sm font-light leading-relaxed">八十年，我們只專心做好一件事：製作能與靈魂共鳴的薩克斯風。堅持 100% 台灣製造。</p>
                            </div>
                            <div>
                                <h4 className="text-white font-bold text-sm tracking-widest uppercase mb-6">聯繫資訊</h4>
                                <p className="font-bold text-stone-300 italic mb-4">0911-375938 Easen</p>
                                <a href="https://www.google.com/maps/search/?api=1&query=404臺中市北區一中街116巷28號" target="_blank" className="flex items-start gap-2 text-xs group hover:text-amber-500 transition-colors">
                                    <LucideIcon name="MapPin" size={14} className="text-amber-500 flex-shrink-0" />
                                    <span>404 臺中市北區一中街116巷28號<br /><span className="text-[10px] underline uppercase tracking-widest mt-1 block">開啟地圖導航</span></span>
                                </a>
                            </div>
                            <div>
                                <h4 className="text-white font-bold text-sm tracking-widest uppercase mb-6">顧客服務</h4>
                                <ul className="space-y-4 text-xs font-light">
                                    <li><button onClick={() => changePage('shipping')} className="hover:text-amber-500 transition-colors uppercase tracking-widest">運送政策 Shipping Policy</button></li>
                                    <li><button onClick={() => changePage('return')} className="hover:text-amber-500 transition-colors uppercase tracking-widest">退換貨政策 Return Policy</button></li>
                                </ul>
                            </div>
                            <div>
                                <h4 onClick={handleAdminTrigger} className="text-white font-bold text-sm tracking-widest uppercase mb-6 cursor-default active:text-amber-500 transition-colors">數據同步</h4>
                                <div className="flex items-center gap-2 text-[10px] font-bold italic text-green-500">
                                    <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                                    Shopify 實時同步啟動
                                </div>
                                <p className="text-[10px] font-bold text-stone-600 uppercase italic mt-4">© 2024 TK MELODY SAXOPHONE.</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const HomePage = ({ onExplore }) => (
            <div className="animate-fade-in text-left">
                <section className="relative h-[85vh] flex items-center overflow-hidden">
                    <div className="absolute inset-0"><img src="https://i.imgur.com/3jRKwrH.jpeg" className="w-full h-full object-cover shadow-2xl" /><div className="absolute inset-0 bg-stone-950/40"></div></div>
                    <div className="relative max-w-7xl mx-auto px-6 w-full text-left">
                        <div className="max-w-4xl space-y-8">
                            <div className="inline-block py-1 px-3 bg-amber-600 text-white text-[10px] font-black tracking-[0.4em] uppercase rounded shadow-lg text-left">Since 1946 Legacy</div>
                            <h1 className="text-5xl md:text-8xl font-black text-white leading-tight italic drop-shadow-2xl uppercase">T.K. SAXOPHONE<br/><span className="text-amber-500 text-3xl md:text-6xl block mt-4 font-black text-left">傳承八十載的台灣匠心</span></h1>
                            <p className="text-lg md:text-xl text-stone-100 font-light max-w-2xl text-left">「八十年，我們只專心做好一件事：製作能與靈魂共鳴的薩克斯風。」</p>
                            <div className="pt-4 text-left"><button onClick={onExplore} className="px-8 md:px-10 py-4 md:py-5 bg-amber-600 text-white rounded-full font-black hover:bg-amber-700 transition shadow-2xl uppercase tracking-widest text-xs flex items-center gap-2">查看產品系列 <LucideIcon name="ChevronRight" size={18} /></button></div>
                        </div>
                    </div>
                </section>
                <section className="py-24 bg-stone-900 text-white overflow-hidden text-left">
                    <div className="max-w-7xl mx-auto px-6">
                        <div className="text-center mb-20"><h2 className="text-4xl font-black italic mb-4 tracking-tight uppercase">國際演奏家之選</h2><p className="text-stone-500 text-sm tracking-[0.2em] uppercase italic font-bold">Trusted by World-Class Artists</p></div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-12 text-left">
                            <ArtistCard name="陳嘉俊 (Wilson Chen)" desc="其個人專屬「嘉」Model 系列在全球爵士圈享有盛譽。" img="https://i.imgur.com/QsOg9vX.jpeg" />
                            <ArtistCard name="小林香織 (Kaori Kobayashi)" desc="多次巡迴演出指定使用 TK 系列產品，體現美感的完美結合。" img="https://i.imgur.com/MgniwDh.jpeg" />
                        </div>
                    </div>
                </section>
                <section className="py-24 bg-white text-center">
                    <div className="max-w-7xl mx-auto px-6 mb-16"><h2 className="text-4xl font-black italic mb-2 tracking-tight uppercase text-stone-900">精緻工藝細節</h2><div className="w-16 h-1 bg-amber-500 mx-auto mt-4"></div></div>
                    <div className="max-w-5xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-8 text-center">
                        {["7h8Tm2w", "ub1b35l", "aN0jyY4", "mOrQ8ou"].map((id, i) => (
                            <div key={i} className="aspect-[4/3] rounded-[2rem] overflow-hidden shadow-lg border border-stone-100 group"><img src={`https://i.imgur.com/${id}.jpeg`} className="w-full h-full object-cover group-hover:scale-110 transition duration-1000" /></div>
                        ))}
                    </div>
                </section>
            </div>
        );

        const ArtistCard = ({ name, desc, img }) => (
            <div className="relative group bg-stone-800/50 rounded-[2.5rem] overflow-hidden flex flex-col shadow-2xl">
                <div className="h-[500px] bg-stone-900"><img src={img} className="w-full h-full object-contain object-bottom transition duration-1000 group-hover:scale-105" /></div>
                <div className="absolute inset-x-0 bottom-0 p-10 bg-gradient-to-t from-stone-950 via-stone-950/60 to-transparent text-left">
                    <h4 className="text-4xl font-black mb-4 italic uppercase">{name}</h4>
                    <p className="text-stone-300 font-light text-sm leading-relaxed">{desc}</p>
                </div>
            </div>
        );

        const ProductsPage = ({ products, loading }) => (
            <div className="max-w-7xl mx-auto px-6 py-20 text-left min-h-[60vh]">
                <div className="text-center mb-16 text-center">
                    <h2 className="text-4xl font-black italic mb-4 tracking-tight uppercase text-stone-900">旗艦系列商品</h2>
                    <p className="text-stone-400 font-light italic text-center">官方商店實時同步。成就您每一次呼吸的純粹。</p>
                </div>
                {loading ? <div className="text-center py-20"><LucideIcon name="Loader2" className="animate-spin text-amber-500 mx-auto" size={48} /></div> : (
                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
                        {products.map((p) => (
                            <div key={p.id} className="bg-white rounded-[2rem] overflow-hidden border border-stone-100 shadow-sm hover:shadow-xl transition flex flex-col h-full group text-left">
                                <div className="aspect-square bg-stone-50 overflow-hidden relative"><img src={p.img} className="w-full h-full object-cover group-hover:scale-110 transition duration-700" alt={p.name} /></div>
                                <div className="p-8 flex flex-col flex-1 text-left">
                                    <h3 className="font-bold text-sm mb-2 h-10 line-clamp-2 uppercase leading-tight">{p.name}</h3>
                                    {!p.hidePrice && <p className="text-amber-700 font-black text-xl mb-6 italic text-left">NT$ {Number(p.price).toLocaleString()}</p>}
                                    {p.hidePrice && <div className="h-8 mb-6"></div>}
                                    <a href={p.url} target="_blank" className="mt-auto w-full py-3 bg-stone-900 text-white rounded-xl text-[10px] font-bold tracking-widest uppercase hover:bg-amber-600 transition flex items-center justify-center gap-2 shadow-lg text-center">立即購買 <LucideIcon name="ExternalLink" size={14} /></a>
                                </div>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );

        const AboutSection = () => (
            <div className="max-w-5xl mx-auto px-6 py-24 animate-fade-in text-left">
                <div className="text-center mb-16 space-y-4">
                    <h2 className="text-4xl font-black italic mb-2 uppercase text-stone-900 leading-tight">T.K. Melody｜八十載匠心</h2>
                    <h3 className="text-amber-600 font-bold tracking-widest text-lg italic text-center">淬鍊台灣薩克斯風的靈魂</h3>
                    <div className="w-24 h-1 bg-amber-500 mx-auto mt-4"></div>
                </div>
                <div className="bg-white p-10 md:p-16 rounded-[2.5rem] border border-stone-100 shadow-sm text-left">
                    <div className="grid md:grid-cols-3 gap-12 text-left">
                        <div className="md:col-span-2 space-y-8 text-left">
                            <section className="text-left"><h4 className="text-xl font-bold text-stone-900 mb-4 flex items-center gap-2"><LucideIcon name="History" className="text-amber-600" /> 【源自后里的工藝傳奇】</h4><p className="text-stone-600 leading-relaxed font-light text-sm md:text-base text-left">在台灣薩克斯風的故鄉——后里，金屬敲擊的共鳴聲已交織了八十個春秋。張氏家族的製琴之路，承載著三代職人的手心溫度。</p></section>
                            <section className="text-left"><h4 className="text-xl font-bold text-stone-900 mb-4 flex items-center gap-2"><LucideIcon name="Music" className="text-amber-600" /> 【靈魂共鳴】</h4><p className="text-stone-600 leading-relaxed font-light text-sm md:text-base text-left">這不只是一件樂器，更是張氏家族跨越時空的承諾。當您拿起 T.K. Melody，您觸摸到的是三代職人的手心溫度，聽見的是后里土地的生命力。</p></section>
                        </div>
                        <img src="https://i.imgur.com/ub1b35l.jpeg" className="rounded-[2rem] shadow-xl w-full object-cover aspect-[3/4] text-left" alt="張氏工藝" />
                    </div>
                </div>
            </div>
        );

        const ServicePage = () => (
            <div className="max-w-4xl mx-auto px-6 py-20 text-center animate-fade-in text-center">
                <LucideIcon name="Shield" size={48} className="mx-auto text-amber-600 mb-6" /><h2 className="text-4xl font-black italic mb-12 uppercase text-stone-900 text-center">售後服務與保養</h2>
                <div className="bg-stone-900 text-white p-12 rounded-[3rem] shadow-2xl relative overflow-hidden max-w-2xl mx-auto text-center">
                    <p className="text-2xl font-black mb-4 tracking-widest italic underline decoration-amber-500 underline-offset-8 text-center leading-tight">0911-375938</p>
                    <p className="text-stone-400 font-light mb-12 uppercase text-[10px] font-bold tracking-widest text-center text-center">專人服務：Easen</p>
                    <button className="px-10 py-4 bg-amber-600 rounded-full font-bold hover:bg-amber-700 transition tracking-widest uppercase text-xs mx-auto text-center">預約專業維修校正</button>
                </div>
            </div>
        );

        const AdminPanel = ({ onClose }) => (
            <div className="max-w-4xl mx-auto px-6 py-20 text-left min-h-[60vh] text-left">
                <div className="flex justify-between items-center mb-10 border-b pb-6 text-left"><h2 className="text-2xl font-black italic uppercase text-stone-900 flex items-center gap-2 text-left"><LucideIcon name="Settings" className="text-amber-600" /> 管理員中心</h2><button onClick={onClose} className="text-xs font-bold border px-4 py-2 rounded-full uppercase tracking-widest hover:bg-stone-100 transition text-nowrap text-left text-center">返回</button></div>
                <div className="bg-white p-10 rounded-[2.5rem] shadow-xl text-left"><p className="text-green-600 font-bold flex items-center gap-2 text-left"><LucideIcon name="CheckCircle2" /> Shopify 已成功串接。商品資訊將自動同步。</p></div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
