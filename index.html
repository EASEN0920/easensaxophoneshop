<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.K. SAXOPHONE | 傳承八十載的台灣匠心</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 核心與 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Lucide 圖示 (全域版) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 引入 Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100;300;400;700;900&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            overflow-x: hidden; 
            background-color: #fafaf9;
        }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        /* 捲軸美化 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f5f5f4; }
        ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 1. Firebase 初始化 ---
        const firebaseConfig = {
            apiKey: "AIzaSyCLedFsORsopOzUhtto5kr8WfEnM28Bh8k",
            authDomain: "tk-saxophone.firebaseapp.com",
            projectId: "tk-saxophone",
            storageBucket: "tk-saxophone.firebasestorage.app",
            messagingSenderId: "64364188077",
            appId: "1:64364188077:web:774938ea6f09f351c39124",
            measurementId: "G-VT59B60JMH"
        };
        const appId = 'tk-saxophone-web';

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // --- 2. 簡化版的圖示組件 ---
        // 使用 lucide-static 的方式，確保不會因為 DOM 操作失敗而讓整個 React 掛掉
        const LucideIcon = ({ name, size = 24, className = "", ...props }) => {
            const iconRef = useRef(null);
            
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    // 根據 CamelCase 轉換名稱
                    const iconName = name.charAt(0).toLowerCase() + name.slice(1).replace(/[A-Z]/g, letter => `-${letter.toLowerCase()}`);
                    iconRef.current.setAttribute('data-lucide', iconName);
                    
                    // 執行渲染
                    window.lucide.createIcons({
                        attrs: {
                            stroke: 'currentColor',
                            'stroke-width': 2,
                            width: size,
                            height: size,
                            class: className
                        }
                    });
                }
            }, [name, size, className]);

            return <i ref={iconRef} className={className} {...props}></i>;
        };

        // --- 3. 主要組件定義 ---

        const HomePage = ({ onExplore }) => (
            <div className="animate-fade-in text-left">
                <section className="relative h-[85vh] flex items-center overflow-hidden">
                    <div className="absolute inset-0">
                        <img src="https://i.imgur.com/3jRKwrH.jpeg" alt="背景" className="w-full h-full object-cover shadow-2xl" />
                        <div className="absolute inset-0 bg-stone-950/40"></div>
                    </div>
                    <div className="relative max-w-7xl mx-auto px-6 w-full">
                        <div className="max-w-4xl space-y-8">
                            <div className="inline-block py-1 px-3 bg-amber-600 text-white text-[10px] font-black tracking-[0.4em] uppercase rounded shadow-lg">Since 1946 Legacy</div>
                            <h1 className="text-6xl md:text-8xl font-black text-white leading-[1.1] tracking-tighter italic drop-shadow-2xl uppercase">
                                T.K. SAXOPHONE<br /><span className="text-amber-500 text-4xl md:text-6xl block mt-4 font-black">傳承八十載的台灣匠心</span>
                            </h1>
                            <p className="text-xl text-stone-100 font-light max-w-2xl leading-relaxed drop-shadow-md">
                                「八十年，我們只專心做好一件事：製作能與靈魂共鳴的薩克斯風。」
                            </p>
                            <div className="flex gap-6 pt-4">
                                <button onClick={onExplore} className="px-10 py-5 bg-amber-600 text-white rounded-full font-black hover:bg-amber-700 transition shadow-2xl uppercase tracking-widest text-xs flex items-center gap-2 group">
                                    查看產品系列 <LucideIcon name="ChevronRight" size={18} className="group-hover:translate-x-1 transition" />
                                </button>
                            </div>
                        </div>
                    </div>
                </section>
                <section className="py-24 bg-white">
                    <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-16 items-center">
                        <div className="space-y-8 text-left">
                            <h2 className="text-4xl font-black text-stone-900 italic tracking-tight uppercase">品牌簡介</h2>
                            <p className="text-amber-600 font-bold tracking-widest text-sm italic border-l-4 border-amber-600 pl-4 uppercase font-black">來自台灣的匠人精神</p>
                            <p className="text-lg text-stone-600 leading-relaxed font-light">
                                來自台灣的 <span className="font-bold text-stone-900">T.K. SAXOPHONE</span>，擁有超過 <span className="font-bold text-amber-700">80 年</span> 的專業製造底蘊。我們將每一把樂器視為「感性」與「創造性」的完美結合。
                            </p>
                            <div className="grid grid-cols-2 gap-6 pt-4 text-left">
                                <div className="space-y-2"><div className="flex items-center gap-2 text-stone-900 font-bold uppercase text-sm"><LucideIcon name="Hammer" size={18} className="text-amber-600" /> 工藝底蘊</div><p className="text-[10px] text-stone-400">跨越三代的製作技術。</p></div>
                                <div className="space-y-2"><div className="flex items-center gap-2 text-stone-900 font-bold uppercase text-sm"><LucideIcon name="Award" size={18} className="text-amber-600" /> 頂級選材</div><p className="text-[10px] text-stone-400">嚴選進口優質黃銅。</p></div>
                            </div>
                        </div>
                        <img src="https://i.imgur.com/DTuYgcN.jpeg" className="rounded-[2rem] shadow-2xl" alt="TK 工藝" />
                    </div>
                </section>
            </div>
        );

        const ProductsPage = ({ products, loading }) => (
            <div className="max-w-7xl mx-auto px-6 py-20 animate-fade-in text-left">
                <div className="text-center mb-16">
                    <h2 className="text-4xl font-black italic mb-4 tracking-tight uppercase text-stone-900">旗艦系列商品</h2>
                    <p className="text-stone-400 font-light italic">綠界科技安全支付。為演奏家量身打造的專業選擇。</p>
                </div>
                {loading ? (
                    <div className="text-center py-20"><LucideIcon name="Loader2" className="animate-spin text-amber-500 mx-auto" size={48} /></div>
                ) : (
                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
                        {products.map((product) => (
                            <div key={product.id} className="bg-white rounded-[2rem] overflow-hidden border border-stone-100 shadow-sm hover:shadow-xl transition flex flex-col h-full group">
                                <div className="aspect-square bg-stone-50 overflow-hidden relative">
                                    <img src={product.img} className="w-full h-full object-cover group-hover:scale-110 transition duration-700" alt={product.name} />
                                </div>
                                <div className="p-8 flex flex-col flex-1">
                                    <h3 className="font-bold text-sm mb-2 h-10 line-clamp-2 uppercase">{product.name}</h3>
                                    <p className="text-amber-700 font-black text-xl mb-6 italic">NT$ {Number(product.price).toLocaleString()}</p>
                                    <a href={product.url} target="_blank" className="mt-auto w-full py-3 bg-stone-900 text-white rounded-xl text-[10px] font-bold tracking-widest uppercase hover:bg-amber-600 transition flex items-center justify-center gap-2">立即購買 <LucideIcon name="ExternalLink" size={14} /></a>
                                </div>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );

        const AboutSection = () => (
            <div className="max-w-5xl mx-auto px-6 py-24 animate-fade-in text-left">
                <div className="text-center mb-16 space-y-4">
                    <h2 className="text-5xl font-black italic mb-4 uppercase">T.K. SAXOPHONE</h2>
                    <p className="text-amber-600 font-bold tracking-widest text-lg italic underline underline-offset-8 decoration-amber-500/30">傳承八十載的台灣匠心</p>
                </div>
                <div className="prose prose-stone max-w-none space-y-12">
                    <div className="bg-white p-10 rounded-[2.5rem] border border-stone-100 shadow-sm text-center">
                        <p className="text-2xl font-light italic uppercase leading-relaxed">「八十年，我們只專心做好一件事：製作能與靈魂共鳴的薩克斯風。」</p>
                    </div>
                </div>
            </div>
        );

        const ServicePage = () => (
            <div className="max-w-4xl mx-auto px-6 py-20 text-center animate-fade-in">
                <LucideIcon name="Shield" size={48} className="mx-auto text-amber-600 mb-6" />
                <h2 className="text-4xl font-black italic mb-12 uppercase text-stone-900">售後服務與保養</h2>
                <div className="bg-stone-900 text-white p-12 rounded-[3rem] shadow-2xl relative overflow-hidden max-w-2xl mx-auto">
                    <p className="text-2xl font-black mb-4 tracking-widest italic underline decoration-amber-500 underline-offset-8">0911-375938</p>
                    <p className="text-stone-400 font-light mb-12 uppercase text-xs">專人服務：Easen</p>
                    <button className="px-10 py-4 bg-amber-600 rounded-full font-bold hover:bg-amber-700 transition tracking-widest uppercase text-xs">預約專業維修校正</button>
                </div>
            </div>
        );

        const AdminPanel = ({ onClose, appId, products, onDelete, notify, isCloudActive }) => {
            const [form, setForm] = useState({ name: '', price: '', img: '', url: '' });
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!isCloudActive) return notify("雲端未連接", "error");
                setIsSubmitting(true);
                try {
                    const db = firebase.firestore();
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products').add({
                        ...form, price: Number(form.price), createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setForm({ name: '', price: '', img: '', url: '' });
                    notify("同步成功！", "success");
                } catch (err) { notify("同步失敗", "error"); }
                setIsSubmitting(false);
            };

            return (
                <div className="max-w-4xl mx-auto px-6 py-20 animate-fade-in text-left">
                    <div className="flex justify-between items-center mb-10 border-b pb-6">
                        <h2 className="text-2xl font-black italic uppercase"><LucideIcon name="Settings" className="mr-2" /> 管理中心</h2>
                        <button onClick={onClose} className="text-xs font-bold border px-4 py-2 rounded-full">返回</button>
                    </div>
                    <div className="bg-white p-10 rounded-[2.5rem] border shadow-xl mb-12">
                        <form onSubmit={handleSubmit} className="grid md:grid-cols-2 gap-8">
                            <input placeholder="商品名稱" required value={form.name} onChange={e => setForm({...form, name: e.target.value})} className="w-full bg-stone-50 border p-4 rounded-2xl outline-none" />
                            <input placeholder="價格" required type="number" value={form.price} onChange={e => setForm({...form, price: e.target.value})} className="w-full bg-stone-50 border p-4 rounded-2xl outline-none" />
                            <input placeholder="綠界 URL" required value={form.url} onChange={e => setForm({...form, url: e.target.value})} className="w-full bg-stone-50 border p-4 rounded-2xl outline-none md:col-span-2" />
                            <input placeholder="圖片 URL" required value={form.img} onChange={e => setForm({...form, img: e.target.value})} className="w-full bg-stone-50 border p-4 rounded-2xl outline-none md:col-span-2" />
                            <button disabled={isSubmitting} className="md:col-span-2 py-5 bg-stone-900 text-white rounded-2xl font-black uppercase text-xs hover:bg-amber-600 transition shadow-lg">立即同步</button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- 4. App 進入點 ---
        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [showAdminIcon, setShowAdminIcon] = useState(false);
            const [adminClickCount, setAdminClickCount] = useState(0);
            const [products, setProducts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [statusMsg, setStatusMsg] = useState(null);
            const [isCloudActive, setIsCloudActive] = useState(false);

            const defaultProducts = [
                { id: 'default-1', name: 'TK.SAXOPHONE 傳奇中音 ALTO SAX', price: 72000, img: 'https://i.imgur.com/f3sTY2J.jpeg', url: 'https://t27v5glqel.cashier.ecpay.com.tw/product/000000000908931' },
                { id: 'default-2', name: 'TK.Saxophone 雅柏次中音 Tenor Sax', price: 120000, img: 'https://i.imgur.com/syUBobO.jpeg', url: 'https://t27v5glqel.cashier.ecpay.com.tw/product/000000000908930' }
            ];

            const notify = (text, type = 'info') => {
                setStatusMsg({ text, type });
                setTimeout(() => setStatusMsg(null), 3000);
            };

            useEffect(() => {
                const init = async () => {
                    try {
                        await firebase.auth().signInAnonymously();
                        setIsCloudActive(true);
                        const db = firebase.firestore();
                        return db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products')
                            .onSnapshot(snap => {
                                const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                setProducts(list.length > 0 ? list : defaultProducts);
                                setLoading(false);
                            }, () => { setProducts(defaultProducts); setLoading(false); });
                    } catch (e) { setProducts(defaultProducts); setLoading(false); }
                };
                const unsub = init();
                return () => unsub.then(f => f && f());
            }, []);

            return (
                <div className="min-h-screen flex flex-col relative">
                    {statusMsg && <div className={`fixed top-24 left-1/2 -translate-x-1/2 z-[100] px-6 py-3 rounded-xl shadow-2xl text-white font-bold text-sm animate-fade-in ${statusMsg.type === 'error' ? 'bg-red-600' : 'bg-amber-600'}`}>{statusMsg.text}</div>}
                    
                    <nav className="fixed w-full z-50 bg-stone-900/95 text-white backdrop-blur-md border-b border-stone-800">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
                            <div className="flex items-center gap-4 cursor-pointer" onClick={() => setCurrentPage('home')}>
                                <img src="https://i.imgur.com/H7NWyZP.png" alt="TK Logo" className="h-10 w-auto" />
                                <div className="flex flex-col border-l border-stone-700 pl-4 text-left leading-tight">
                                    <span className="text-xl font-bold tracking-widest text-amber-500 italic leading-none uppercase">TK SAXOPHONE</span>
                                    <span className="text-[9px] tracking-[0.2em] text-stone-400 font-bold uppercase mt-1">100% 台灣製造</span>
                                </div>
                            </div>
                            <div className="hidden md:flex space-x-10 text-xs font-bold tracking-widest uppercase">
                                <button onClick={() => setCurrentPage('home')} className={currentPage === 'home' ? 'text-amber-500' : ''}>首頁</button>
                                <button onClick={() => setCurrentPage('about')} className={currentPage === 'about' ? 'text-amber-500' : ''}>品牌簡介</button>
                                <button onClick={() => setCurrentPage('products')} className={currentPage === 'products' ? 'text-amber-500' : ''}>產品系列</button>
                                <button onClick={() => setCurrentPage('service')} className={currentPage === 'service' ? 'text-amber-500' : ''}>售後服務</button>
                            </div>
                            <div className="flex items-center gap-4">
                                <a href="https://t27v5glqel.cashier.ecpay.com.tw" target="_blank" className="p-2 hover:bg-stone-800 rounded-full transition flex items-center gap-2 text-xs font-bold">
                                    <LucideIcon name="ShoppingCart" size={22} className="text-amber-500" />
                                    <span className="hidden sm:inline uppercase tracking-widest text-white">線上商城</span>
                                </a>
                                {showAdminIcon && <button onClick={() => setCurrentPage('admin')} className="p-2 bg-amber-600 rounded-full animate-pulse"><LucideIcon name="Settings" size={20} /></button>}
                            </div>
                        </div>
                    </nav>

                    <main className="pt-20 flex-1">
                        {currentPage === 'home' && <HomePage onExplore={() => setCurrentPage('products')} />}
                        {currentPage === 'about' && <AboutSection />}
                        {currentPage === 'products' && <ProductsPage products={products} loading={loading} isCloudActive={isCloudActive} />}
                        {currentPage === 'service' && <ServicePage />}
                        {currentPage === 'admin' && <AdminPanel onClose={() => setCurrentPage('products')} appId={appId} products={products} notify={notify} isCloudActive={isCloudActive} />}
                    </main>

                    <footer className="bg-stone-950 text-stone-500 py-16 mt-auto">
                        <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-4 gap-12 text-left">
                            <div className="col-span-2"><div className="flex items-center gap-4 mb-6"><img src="https://i.imgur.com/H7NWyZP.png" alt="Logo" className="h-8 opacity-90" /><span className="text-xl font-bold tracking-widest text-white italic uppercase">TK SAXOPHONE</span></div><p className="text-sm leading-relaxed max-w-sm">八十年，我們只專心做好一件事：製作能與靈魂共鳴的薩克斯風。</p></div>
                            <div><h4 className="text-white font-bold text-sm tracking-widest uppercase mb-6">聯繫資訊</h4><p className="font-bold text-stone-300 italic underline underline-offset-4 mb-4">0911-375938 Easen</p><p className="flex items-start gap-2 text-xs"><LucideIcon name="MapPin" size={14} className="text-amber-500 flex-shrink-0" /> 台中旗艦店</p></div>
                            <div><h4 onClick={() => { const c = adminClickCount + 1; setAdminClickCount(c); if(c>=3) { setShowAdminIcon(true); notify("管理入口開啟"); } }} className="text-white font-bold text-sm tracking-widest uppercase mb-6 cursor-default">購物保障</h4><div className={`flex items-center gap-2 text-[10px] font-bold italic ${isCloudActive ? 'text-green-500' : 'text-stone-700'}`}>{isCloudActive ? '雲端同步正常' : '離線模式'}</div></div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
