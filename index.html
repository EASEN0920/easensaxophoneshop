<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- 強制瀏覽器使用 UTF-8 編碼，防止 GitHub Pages 出現亂碼 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK SAXOPHONE | 傳承八十載的台灣匠心</title>
    
    <!-- 載入外部資源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100;300;400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fafaf9; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .sidebar-transition { transition: transform 0.3s ease-in-out; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f5f5f4; }
        ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 10px; }
        .text-gradient { background: linear-gradient(to right, #d97706, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 1. Shopify 配置 ---
        const SHOPIFY_DOMAIN = 'tk-saxophone.myshopify.com';
        const SHOPIFY_TOKEN = '6992f8d32d2f2b395e09519c2760f80f';

        const LucideIcon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    const iconName = name.charAt(0).toLowerCase() + name.slice(1).replace(/[A-Z]/g, l => `-${l.toLowerCase()}`);
                    iconRef.current.setAttribute('data-lucide', iconName);
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i ref={iconRef} style={{ width: size, height: size, display: 'inline-block' }} className={className}></i>;
        };

        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [shopifyProducts, setShopifyProducts] = useState([]);
            const [newsData, setNewsData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [newsLoading, setNewsLoading] = useState(true);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);

            useEffect(() => {
                const fetchShopifyData = async () => {
                    const gqlQuery = `
                    {
                      products(first: 20) {
                        edges {
                          node {
                            id title handle
                            priceRange { minVariantPrice { amount } }
                            images(first: 1) { edges { node { url } } }
                          }
                        }
                      }
                      articles(first: 10) {
                        edges {
                          node {
                            id title contentHtml publishedAt
                            blog { title }
                          }
                        }
                      }
                    }`;

                    try {
                        const response = await fetch(`https://${SHOPIFY_DOMAIN}/api/2024-01/graphql.json`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'X-Shopify-Storefront-Access-Token': SHOPIFY_TOKEN },
                            body: JSON.stringify({ query: gqlQuery }),
                        });
                        const result = await response.json();
                        if (result.data) {
                            setShopifyProducts(result.data.products.edges.map(edge => ({
                                id: edge.node.id, name: edge.node.title, price: edge.node.priceRange.minVariantPrice.amount,
                                img: edge.node.images.edges[0]?.node.url || 'https://i.imgur.com/f3sTY2J.jpeg',
                                url: `https://${SHOPIFY_DOMAIN}/products/${edge.node.handle}`,
                                hidePrice: edge.node.title.includes('傳奇') || edge.node.title.includes('雅柏')
                            })));
                            setNewsData(result.data.articles.edges.map(edge => ({
                                id: edge.node.id, title: edge.node.title, content: edge.node.contentHtml.replace(/<[^>]*>?/gm, ''), 
                                date: new Date(edge.node.publishedAt).toLocaleDateString('zh-TW').replace(/\//g, '.'),
                                category: edge.node.blog.title
                            })));
                        }
                    } catch (e) { console.error(e); } finally { setLoading(false); setNewsLoading(false); }
                };
                fetchShopifyData();
            }, []);

            const changePage = (page) => { setCurrentPage(page); setIsSidebarOpen(false); window.scrollTo(0, 0); };

            const NavItem = ({ id, label }) => (
                <button 
                    onClick={() => changePage(id)} 
                    className={`${currentPage === id ? 'text-amber-500 border-b-2 border-amber-500' : 'hover:text-amber-400'} transition font-bold tracking-widest uppercase text-xs lg:text-sm py-2`}
                >
                    {label}
                </button>
            );

            return (
                <div className="min-h-screen flex flex-col bg-stone-50 text-left">
                    <nav className="fixed w-full z-50 bg-stone-900/95 text-white backdrop-blur-md border-b border-stone-800 shadow-xl">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
                            <div className="flex items-center gap-4 cursor-pointer" onClick={() => changePage('home')}>
                                <img src="https://i.imgur.com/H7NWyZP.png" alt="TK Logo" className="h-10 w-auto" />
                                <div className="flex flex-col border-l border-stone-700 pl-4 leading-tight text-left">
                                    <span className="text-lg md:text-xl font-bold tracking-widest text-amber-500 italic leading-none uppercase">TK SAXOPHONE</span>
                                    <span className="text-[9px] tracking-[0.2em] text-stone-400 font-bold uppercase mt-1">100% 台灣製造</span>
                                </div>
                            </div>
                            <div className="hidden lg:flex space-x-6 text-base font-bold tracking-widest uppercase text-left">
                                <NavItem id="home" label="首頁" />
                                <NavItem id="news" label="最新消息" />
                                <NavItem id="lessons" label="教學課程" />
                                <NavItem id="about" label="品牌簡介" />
                                <NavItem id="products" label="產品系列" />
                                <NavItem id="service" label="售後服務" />
                            </div>
                            <div className="flex items-center gap-4">
                                <a href={`https://${SHOPIFY_DOMAIN}`} target="_blank" className="hidden md:flex bg-amber-600 hover:bg-amber-700 p-3 rounded-full font-black text-white text-sm shadow-lg">
                                    <LucideIcon name="ShoppingCart" size={18} /> <span className="ml-2 uppercase tracking-widest text-[10px]">進入商城</span>
                                </a>
                                <button onClick={() => setIsSidebarOpen(true)} className="lg:hidden p-2 text-stone-400"><LucideIcon name="Menu" size={28} /></button>
                            </div>
                        </div>
                    </nav>

                    {isSidebarOpen && <div className="fixed inset-0 bg-black/60 z-[60] md:hidden backdrop-blur-sm" onClick={() => setIsSidebarOpen(false)}></div>}
                    <aside className={`fixed top-0 right-0 h-full w-72 bg-stone-900 z-[70] shadow-2xl md:hidden sidebar-transition transform ${isSidebarOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                        <div className="flex flex-col h-full p-8 text-left">
                            <div className="flex justify-between items-center mb-12 text-left">
                                <span className="text-amber-500 font-bold tracking-widest uppercase italic text-left">功能導覽</span>
                                <button onClick={() => setIsSidebarOpen(false)} className="text-stone-400 hover:text-white text-left"><LucideIcon name="X" size={28} /></button>
                            </div>
                            <nav className="flex flex-col space-y-6 text-left">
                                {['home', 'news', 'lessons', 'about', 'products', 'service'].map(p => (
                                    <button key={p} onClick={() => changePage(p)} className={`text-xl font-bold tracking-widest uppercase text-left ${currentPage === p ? 'text-amber-500' : 'text-stone-300'}`}>
                                        {p === 'home' ? '首頁' : p === 'news' ? '最新消息' : p === 'lessons' ? '薩克斯風教學' : p === 'about' ? '品牌簡介' : p === 'products' ? '產品系列' : '售後服務'}
                                    </button>
                                ))}
                                <div className="pt-8 border-t border-stone-800 text-left">
                                    <button onClick={() => changePage('shipping')} className="text-stone-400 text-sm mb-4 block uppercase font-bold tracking-widest text-left">運送政策</button>
                                    <button onClick={() => changePage('return')} className="text-stone-400 text-sm block uppercase font-bold tracking-widest text-left">退換貨政策</button>
                                </div>
                            </nav>
                        </div>
                    </aside>

                    <main className="pt-20 flex-1">
                        {currentPage === 'home' && <HomePage onExplore={() => changePage('products')} />}
                        {currentPage === 'news' && <NewsPage newsData={newsData} loading={newsLoading} />}
                        {currentPage === 'lessons' && <LessonsPage />}
                        {currentPage === 'about' && <AboutSection />}
                        {currentPage === 'products' && <ProductsPage products={shopifyProducts} loading={loading} />}
                        {currentPage === 'service' && <ServicePage />}
                        {currentPage === 'shipping' && <PolicyPage title="運送政策 Shipping Policy" content="一般配件與耗材：於 TK SAXOPHONE 官網購買之配件、耗材類商品，依系統標示之基本運費計算。\n\n樂器類商品：由於薩克斯風屬於精密儀器且單價較高，樂器類商品限於「一中旗艦店」現場訂購。其運費將依據最終配送方式實報實銷。" />}
                        {currentPage === 'return' && <PolicyPage title="退換貨政策 Return Policy" content="一、七天鑑賞期與開箱存證\n於 TK SAXOPHONE 官方網站購買之商品，均享有商品到貨次日起七天內之鑑賞期（非試用期）。\n【重要提醒】 為保障雙方權益，請您在拆封包裹時全程錄影。" />}
                    </main>

                    <footer className="bg-stone-950 text-stone-500 py-16 mt-auto text-left">
                        <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12 text-left">
                            <div>
                                <div className="flex items-center gap-4 mb-6"><img src="https://i.imgur.com/H7NWyZP.png" alt="Logo" className="h-8 opacity-90" /><span className="text-xl font-bold tracking-widest text-white italic uppercase text-nowrap text-left">TK SAXOPHONE</span></div>
                                <p className="text-sm font-light leading-relaxed text-left">傳承八十載台灣匠心，製作能與靈魂共鳴的薩克斯風。堅持 100% 台灣製造。</p>
                            </div>
                            <div className="text-left">
                                <h4 className="text-white font-bold text-sm tracking-widest uppercase mb-6 text-left">聯繫資訊</h4>
                                <div className="space-y-4">
                                    <div className="flex items-start gap-3">
                                        <LucideIcon name="MapPin" size={16} className="text-amber-500 mt-1 flex-shrink-0" />
                                        <div className="text-xs">
                                            <p className="font-bold text-stone-200">TK SAXOPHONE 台中一中旗艦店</p>
                                            <p className="text-stone-400 mt-1">404臺中市北區一中街116巷28號</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <LucideIcon name="Phone" size={16} className="text-amber-500 flex-shrink-0" />
                                        <p className="font-bold text-stone-300 italic text-xs">0911-375938 Easen</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-4 pt-6 mt-6 border-t border-stone-900 text-left">
                                    <a href="https://www.facebook.com/tksaxophone1948/" target="_blank" className="p-2 bg-stone-900 rounded-full hover:bg-blue-600 transition"><LucideIcon name="Facebook" size={18} /></a>
                                    <a href="https://www.instagram.com/tk_saxophone" target="_blank" className="p-2 bg-stone-900 rounded-full hover:bg-pink-600 transition"><LucideIcon name="Instagram" size={18} /></a>
                                    <a href="https://www.youtube.com/@tksaxophone1948" target="_blank" className="p-2 bg-stone-900 rounded-full hover:bg-red-600 transition"><LucideIcon name="Youtube" size={18} /></a>
                                </div>
                            </div>
                            <div className="text-left">
                                <h4 className="text-white font-bold text-sm tracking-widest uppercase mb-6 text-left text-left">顧客服務</h4>
                                <ul className="space-y-4 text-xs font-light text-left">
                                    <li><button onClick={() => changePage('shipping')} className="hover:text-amber-500 uppercase tracking-widest text-left">運送政策 Shipping Policy</button></li>
                                    <li><button onClick={() => changePage('return')} className="hover:text-amber-500 uppercase tracking-widest text-left">退換貨政策 Return Policy</button></li>
                                </ul>
                            </div>
                            <div className="text-left">
                                <h4 className="text-white font-bold text-sm tracking-widest uppercase mb-6 text-left text-left text-left">數據同步</h4>
                                <div className="flex items-center gap-2 text-[10px] font-bold italic text-green-500 uppercase text-left"><div className="w-2 h-2 rounded-full bg-green-500 animate-pulse text-left"></div>Shopify Sync Active</div>
                                <p className="text-[9px] text-stone-700 mt-4 text-left">© 2024 TK MELODY SAXOPHONE.</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        // --- 核心組件：薩克斯風教學 ---
        const LessonsPage = () => (
            <div className="max-w-6xl mx-auto px-6 py-24 animate-fade-in text-left">
                <div className="mb-20 text-center">
                    <h2 className="text-4xl md:text-5xl font-black italic mb-4 text-stone-900 uppercase tracking-tight">薩克斯風專業教學</h2>
                    <p className="text-amber-600 font-bold tracking-[0.3em] uppercase italic text-center text-sm md:text-base">Master the Soul of Music: Professional Lessons</p>
                    <div className="w-20 h-1 bg-amber-500 mx-auto mt-6"></div>
                </div>

                <div className="grid lg:grid-cols-3 gap-10 items-stretch mb-24 text-left">
                    {/* 教學方式 */}
                    <div className="bg-white p-10 rounded-[2.5rem] shadow-sm border border-stone-100 flex flex-col hover:shadow-xl transition-shadow duration-500">
                        <div className="w-12 h-12 bg-amber-50 rounded-2xl flex items-center justify-center mb-8">
                            <LucideIcon name="UserCheck" className="text-amber-600" size={28} />
                        </div>
                        <h3 className="text-xl font-bold text-stone-900 mb-6 tracking-widest">一對一極致教學</h3>
                        <p className="text-stone-500 leading-relaxed font-light flex-1">
                            我們摒棄大班制的通才教育，堅持採 <span className="font-bold text-stone-800 underline decoration-amber-500 decoration-2">一對一專業指導</span>。針對您的氣息、嘴型、指法與情感表達進行精準校正，讓學習進度事半功倍。
                        </p>
                    </div>

                    {/* 教學地點 */}
                    <div className="bg-white p-10 rounded-[2.5rem] shadow-sm border border-stone-100 flex flex-col hover:shadow-xl transition-shadow duration-500">
                        <div className="w-12 h-12 bg-amber-50 rounded-2xl flex items-center justify-center mb-8">
                            <LucideIcon name="MapPin" className="text-amber-600" size={28} />
                        </div>
                        <h3 className="text-xl font-bold text-stone-900 mb-6 tracking-widest text-left">旗艦店專業環境</h3>
                        <div className="flex-1">
                            <p className="text-stone-800 font-bold text-base mb-2">TK SAXOPHONE 台中一中旗艦店</p>
                            <p className="text-amber-600 font-bold text-sm mb-4 italic uppercase tracking-widest">404臺中市北區一中街116巷28號</p>
                            <p className="text-stone-500 leading-relaxed font-light">
                                在專業試奏隔音空間中學習，環境優雅舒適。下課後，現場更有專業技師團隊隨時為您的愛琴進行保養與檢測。
                            </p>
                        </div>
                    </div>

                    {/* 課程方案 */}
                    <div className="bg-stone-900 text-white p-10 rounded-[3rem] shadow-2xl relative overflow-hidden flex flex-col hover:scale-[1.02] transition-transform duration-500 text-left">
                        <div className="absolute top-0 right-0 p-6 opacity-10 text-left">
                            <LucideIcon name="Music" size={150} />
                        </div>
                        <h3 className="text-xl font-bold text-amber-500 mb-8 tracking-widest uppercase text-left">精選課程方案</h3>
                        <div className="space-y-10 flex-1 relative z-10 text-left">
                            <div className="text-left">
                                <h4 className="text-stone-500 uppercase tracking-widest text-[10px] font-black mb-3 text-left">單堂時長 / Duration</h4>
                                <p className="text-4xl font-black italic text-left">50 <span className="text-sm font-normal not-italic text-stone-400">分鐘 / 堂</span></p>
                            </div>
                            <div className="text-left">
                                <h4 className="text-stone-500 uppercase tracking-widest text-[10px] font-black mb-3 text-left">專案費用 / Total Fee</h4>
                                <p className="text-6xl font-black text-amber-500 italic leading-none text-left">NT$ 3,200</p>
                                <p className="text-[10px] text-stone-400 mt-4 font-bold uppercase tracking-widest text-left text-left">內含 4 堂專業課程 / 每堂僅需 $800</p>
                            </div>
                        </div>
                        <a 
                            href="https://lin.ee/0eYWepl" 
                            target="_blank" 
                            className="mt-12 block w-full py-5 bg-amber-600 text-white text-center rounded-2xl font-black uppercase text-xs tracking-[0.2em] hover:bg-amber-700 transition-colors shadow-lg text-left"
                        >
                            立即聯繫預約
                        </a>
                    </div>
                </div>

                {/* 師資預留位 */}
                <div className="pt-20 border-t border-stone-200 text-center text-center">
                    <h3 className="text-3xl font-black italic text-stone-900 mb-4">Elite Faculty</h3>
                    <p className="text-stone-400 text-sm font-light mb-16 italic uppercase tracking-widest text-center text-center">與頂尖演奏家共鳴</p>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-10">
                        {[1, 2, 3].map(i => (
                            <div key={i} className="group aspect-[3/4] bg-white rounded-[2.5rem] flex flex-col items-center justify-center p-12 border border-stone-100 shadow-sm hover:shadow-lg transition-all border-2 border-dashed border-stone-200 text-center">
                                <div className="w-20 h-20 rounded-full bg-stone-50 flex items-center justify-center mb-6 group-hover:bg-amber-50 transition-colors">
                                    <LucideIcon name="User" size={40} className="text-stone-200 group-hover:text-amber-500 transition-colors" />
                                </div>
                                <p className="text-stone-300 font-bold tracking-[0.2em] text-xs italic uppercase text-center">師資資料建置中</p>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        const HomePage = ({ onExplore }) => (
            <div className="animate-fade-in text-left text-left">
                <section className="relative h-[85vh] flex items-center overflow-hidden text-left"><div className="absolute inset-0 text-left"><img src="https://i.imgur.com/3jRKwrH.jpeg" className="w-full h-full object-cover shadow-2xl text-left" /><div className="absolute inset-0 bg-stone-950/40 text-left text-left"></div></div><div className="relative max-w-7xl mx-auto px-6 w-full text-left"><div className="max-w-4xl space-y-8 text-left text-left"><div className="inline-block py-1 px-3 bg-amber-600 text-white text-[10px] font-black tracking-[0.4em] uppercase rounded shadow-lg text-left text-left">Since 1946 Legacy</div><h1 className="text-5xl md:text-8xl font-black text-white leading-tight italic drop-shadow-2xl uppercase text-left text-left">T.K. SAXOPHONE<br/><span className="text-amber-500 text-3xl md:text-6xl block mt-4 font-black text-left">傳承八十載的台灣匠心</span></h1><p className="text-lg md:text-xl text-stone-100 font-light max-w-2xl text-left text-left">「八十年，我們只專心做好一件事：製作能與靈魂共鳴的薩克斯風。」</p><div className="pt-4 text-left text-left"><button onClick={onExplore} className="px-8 md:px-10 py-4 md:py-5 bg-amber-600 text-white rounded-full font-black hover:bg-amber-700 transition shadow-2xl uppercase tracking-widest text-xs flex items-center gap-2 text-left">查看產品系列 <LucideIcon name="ChevronRight" size={18} /></button></div></div></div></section>
                <section className="py-24 bg-stone-900 text-white text-left text-left"><div className="max-w-7xl mx-auto px-6 text-left text-left"><div className="text-center mb-20 text-center"><h2 className="text-4xl font-black italic mb-4 tracking-tight uppercase text-center text-center">國際演奏家之選</h2><p className="text-stone-500 text-sm tracking-[0.2em] uppercase italic font-bold text-center text-center text-center">Trusted by World-Class Artists</p></div><div className="grid grid-cols-1 md:grid-cols-2 gap-12 text-left text-left"><ArtistCard name="陳嘉俊 (Wilson Chen)" desc="其個人專屬「嘉」Model 系列在全球爵士圈享有盛譽。" img="https://i.imgur.com/QsOg9vX.jpeg" /><ArtistCard name="小林香織 (Kaori Kobayashi)" desc="多次巡迴演出指定使用 TK 系列產品。" img="https://i.imgur.com/MgniwDh.jpeg" /></div></div></section>
            </div>
        );

        const NewsPage = ({ newsData, loading }) => (
            <div className="max-w-4xl mx-auto px-6 py-24 animate-fade-in text-left min-h-[60vh] text-left">
                <div className="mb-16 text-center text-center text-center"><h2 className="text-4xl font-black italic mb-4 text-stone-900 uppercase">最新消息 News</h2><div className="w-16 h-1 bg-amber-500 mx-auto"></div></div>
                {loading ? (<div className="text-center py-20 text-stone-400"><LucideIcon name="Loader2" className="animate-spin text-amber-500 mx-auto mb-4" size={48} />正在同步公告...</div>) : newsData.length === 0 ? (<p className="text-center text-stone-400 italic">目前尚無最新消息</p>) : (
                    <div className="space-y-10">{newsData.map(item => (<div key={item.id} className="bg-white p-10 rounded-[2.5rem] shadow-sm border border-stone-100 flex flex-col gap-6 group hover:shadow-md transition text-left text-left"><div className="flex justify-between items-start text-left"><div className="flex items-center gap-3"><span className="text-amber-600 font-bold text-sm tracking-widest">{item.date}</span><div className="text-[10px] uppercase font-black bg-stone-100 text-stone-500 px-3 py-1 rounded-full">{item.category}</div></div><LucideIcon name="Volume2" size={18} className="text-stone-200 group-hover:text-amber-500 transition" /></div><div className="space-y-4 text-left text-left text-left text-left"><h3 className="text-2xl font-bold text-stone-900 leading-tight text-left text-left">{item.title}</h3><p className="text-stone-500 font-light leading-relaxed whitespace-pre-wrap text-left text-left">{item.content}</p></div></div>))}</div>
                )}
            </div>
        );

        const AboutSection = () => (
            <div className="max-w-5xl mx-auto px-6 py-24 animate-fade-in text-left text-left">

                    <h2 className="text-4xl font-black italic mb-2 uppercase text-stone-900 leading-tight text-center">T.K. Melody｜八十載匠心</h2>
                    <h3 className="text-amber-600 font-bold tracking-widest text-lg italic text-center text-center text-center">淬鍊台灣薩克斯風的靈魂</h3>
                    <div className="w-24 h-1 bg-amber-500 mx-auto mt-4 text-center"></div>
                </div>
                <div className="bg-white p-10 md:p-16 rounded-[2.5rem] border border-stone-100 shadow-sm text-left text-left">
                    <div className="grid md:grid-cols-3 gap-12 text-left">
                        <div className="md:col-span-2 space-y-8 text-left text-left">
                            <section className="text-left text-left text-left text-left text-left"><h4 className="text-xl font-bold text-stone-900 mb-4 flex items-center gap-2 text-left text-left text-left text-left"><LucideIcon name="History" className="text-amber-600" /> 【源自后里的工藝傳奇】</h4><p className="text-stone-600 leading-relaxed font-light text-sm md:text-base text-left text-left text-left">在台灣薩克斯風的故鄉——后里，金屬敲擊的共鳴聲已交織了八十個春秋。張氏家族的製琴之路，承載著一甲子的呼吸與傳承。</p></section>
                            <section className="text-left text-left text-left text-left text-left text-left text-left"><h4 className="text-xl font-bold text-stone-900 mb-4 flex items-center gap-2 text-left text-left text-left text-left text-left text-left text-left text-left text-left"><LucideIcon name="Music" className="text-amber-600" /> 【靈魂共鳴】</h4><p className="text-stone-600 leading-relaxed font-light text-sm md:text-base text-left text-left text-left text-left text-left">當您拿起 T.K. Melody，您觸摸到的是三代職人的手心溫度，聽見的是后里土地的生命力。</p></section>
                        </div>
                        <img src="https://i.imgur.com/ub1b35l.jpeg" className="rounded-[2rem] shadow-xl w-full object-cover aspect-[3/4] text-left text-left text-left" alt="匠心" />
                    </div>
                </div>
            </div>
        );

        const ArtistCard = ({ name, desc, img }) => (
            <div className="relative group bg-stone-800/50 rounded-[2.5rem] overflow-hidden flex flex-col shadow-2xl text-left text-left text-left text-left"><div className="h-[500px] bg-stone-900 text-left text-left text-left text-left text-left"><img src={img} className="w-full h-full object-contain object-bottom transition duration-1000 group-hover:scale-105" /></div><div className="absolute inset-x-0 bottom-0 p-10 bg-gradient-to-t from-stone-950 via-stone-950/60 to-transparent text-left text-left text-left text-left text-left text-left"><h4 className="text-4xl font-black mb-4 italic uppercase text-left text-left text-left text-left text-left">{name}</h4><p className="text-stone-300 font-light text-sm leading-relaxed text-left text-left text-left text-left text-left text-left text-left text-left">{desc}</p></div></div>
        );

        const ProductsPage = ({ products, loading }) => (
            <div className="max-w-7xl mx-auto px-6 py-20 text-left min-h-[60vh] text-left text-left text-left text-left">
                <div className="text-center mb-16 text-center text-center text-center text-center text-center text-center"><h2 className="text-4xl font-black italic mb-4 tracking-tight uppercase text-stone-900 text-center text-center text-center text-center">旗艦系列商品</h2><p className="text-stone-400 font-light italic text-center text-center text-center">官方商店實時同步</p></div>
                {loading ? <div className="text-center py-20 text-center text-center text-center text-center text-center text-center"><LucideIcon name="Loader2" className="animate-spin text-amber-500 mx-auto" size={48} /></div> : (
                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8 text-left text-left text-left">{products.map(p => (<div key={p.id} className="bg-white rounded-[2rem] overflow-hidden border border-stone-100 shadow-sm hover:shadow-xl transition flex flex-col h-full group text-left text-left"><div className="aspect-square bg-stone-50 overflow-hidden relative text-left text-left text-left text-left"><img src={p.img} className="w-full h-full object-cover group-hover:scale-110 transition duration-700 text-left text-left text-left" alt={p.name} /></div><div className="p-8 flex flex-col flex-1 text-left text-left text-left text-left text-left text-left text-left text-left"><h3 className="font-bold text-sm mb-2 h-10 line-clamp-2 uppercase leading-tight text-left text-left text-left text-left">{p.name}</h3>{!p.hidePrice && <p className="text-amber-700 font-black text-xl mb-6 italic text-left text-left text-left text-left">NT$ {Number(p.price).toLocaleString()}</p>}<a href={p.url} target="_blank" className="mt-auto w-full py-3 bg-stone-900 text-white rounded-xl text-[10px] font-black tracking-widest uppercase hover:bg-amber-600 transition flex items-center justify-center gap-2 shadow-lg text-center text-center text-center text-center text-center">立即購買 <LucideIcon name="ExternalLink" size={14} /></a></div></div>))}</div>
                )}
            </div>
        );

        const ServicePage = () => (
            <div className="max-w-4xl mx-auto px-6 py-20 text-center animate-fade-in text-center text-center text-center text-center text-center text-center">
                <LucideIcon name="Shield" size={48} className="mx-auto text-amber-600 mb-6 text-center text-center text-center text-center text-center text-center" /><h2 className="text-4xl font-black italic mb-12 uppercase text-stone-900 text-center text-center text-center text-center text-center">售後服務與保養</h2>
                <div className="bg-stone-900 text-white p-12 rounded-[3rem] shadow-2xl relative overflow-hidden max-w-2xl mx-auto text-center text-center text-center text-center text-center text-center">
                    <p className="text-2xl font-black mb-4 tracking-widest italic text-center text-center text-center text-center text-center leading-tight">0911-375938</p>
                    <p className="text-stone-400 font-light mb-12 uppercase text-[10px] font-bold tracking-widest text-center text-center text-center text-center text-center text-center">專人服務：Easen</p>
                    <button className="px-10 py-4 bg-amber-600 rounded-full font-bold hover:bg-amber-700 transition tracking-widest uppercase text-xs mx-auto text-center text-center text-center text-center text-center text-center text-center text-center text-center">預約專業維修校正</button>
                </div>
            </div>
        );

        const PolicyPage = ({ title, content }) => (
            <div className="max-w-4xl mx-auto px-6 py-24 animate-fade-in text-left text-left text-left text-left text-left">
                <h2 className="text-3xl font-black mb-12 uppercase italic text-stone-900 border-b pb-6 text-left text-left text-left text-left">{title}</h2>
                <div className="bg-white p-10 rounded-[2.5rem] shadow-sm text-stone-600 leading-relaxed font-light whitespace-pre-wrap text-left text-left text-left text-left text-left text-left">{content}</div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
