<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- --- SEO 基礎設定 --- -->

      ]

    <!-- 載入外部資源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100;300;400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fafaf9; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .sidebar-transition { transition: transform 0.3s ease-in-out; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f5f5f4; }
        ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 10px; }
        .text-gradient { background: linear-gradient(to right, #d97706, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 1. Shopify 配置 ---
        const SHOPIFY_DOMAIN = 'tk-saxophone.myshopify.com';
        const SHOPIFY_TOKEN = '6992f8d32d2f2b395e09519c2760f80f';

        const LucideIcon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    const iconName = name.charAt(0).toLowerCase() + name.slice(1).replace(/[A-Z]/g, l => `-${l.toLowerCase()}`);
                    iconRef.current.setAttribute('data-lucide', iconName);
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i ref={iconRef} style={{ width: size, height: size, display: 'inline-block' }} className={className}></i>;
        };

        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [shopifyProducts, setShopifyProducts] = useState([]);
            const [newsData, setNewsData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [newsLoading, setNewsLoading] = useState(true);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);

            useEffect(() => {
                const fetchShopifyData = async () => {
                    const gqlQuery = `
                    {
                      products(first: 20) {
                        edges {
                          node {
                            id title handle
                            priceRange { minVariantPrice { amount } }
                            images(first: 1) { edges { node { url } } }
                          }
                        }
                      }
                      articles(first: 10) {
                        edges {
                          node {
                            id title contentHtml publishedAt
                            blog { title }
                          }
                        }
                      }
                    }`;

                    try {
                        const response = await fetch(`https://${SHOPIFY_DOMAIN}/api/2024-01/graphql.json`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'X-Shopify-Storefront-Access-Token': SHOPIFY_TOKEN },
                            body: JSON.stringify({ query: gqlQuery }),
                        });
                        const result = await response.json();
                        if (result.data) {
                            setShopifyProducts(result.data.products.edges.map(edge => ({
                                id: edge.node.id, name: edge.node.title, price: edge.node.priceRange.minVariantPrice.amount,
                                img: edge.node.images.edges[0]?.node.url || 'https://i.imgur.com/f3sTY2J.jpeg',
                                url: `https://${SHOPIFY_DOMAIN}/products/${edge.node.handle}`,
                                hidePrice: edge.node.title.includes('傳奇') || edge.node.title.includes('雅柏')
                            })));
                            setNewsData(result.data.articles.edges.map(edge => ({
                                id: edge.node.id, title: edge.node.title, content: edge.node.contentHtml.replace(/<[^>]*>?/gm, ''), 
                                date: new Date(edge.node.publishedAt).toLocaleDateString('zh-TW').replace(/\//g, '.'),
                                category: edge.node.blog.title
                            })));
                        }
                    } catch (e) { console.error(e); } finally { setLoading(false); setNewsLoading(false); }
                };
                fetchShopifyData();
            }, []);

            const changePage = (page) => { setCurrentPage(page); setIsSidebarOpen(false); window.scrollTo(0, 0); };

            const NavItem = ({ id, label }) => (
                <button 
                    onClick={() => changePage(id)} 
                    className={`${currentPage === id ? 'text-amber-500 border-b-2 border-amber-500' : 'hover:text-amber-400'} transition font-bold tracking-widest uppercase text-xs lg:text-sm py-2`}
                >
                    {label}
                </button>
            );

            return (
                <div className="min-h-screen flex flex-col bg-stone-50 text-left">
                    <nav className="fixed w-full z-50 bg-stone-900/95 text-white backdrop-blur-md border-b border-stone-800 shadow-xl">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center text-left">
                            <div className="flex items-center gap-4 cursor-pointer text-left" onClick={() => changePage('home')}>
                                <img src="https://i.imgur.com/H7NWyZP.png" alt="TK SAXOPHONE Logo" className="h-10 w-auto" />
                                <div className="flex flex-col border-l border-stone-700 pl-4 leading-tight text-left">
                                    <span className="text-lg md:text-xl font-bold tracking-widest text-amber-500 italic leading-none uppercase">TK SAXOPHONE</span>
                                    <span className="text-[9px] tracking-[0.2em] text-stone-400 font-bold uppercase mt-1">100% 台灣製造</span>
                                </div>
                            </div>
                            <div className="hidden lg:flex space-x-6 text-base font-bold tracking-widest uppercase text-left">
                                <NavItem id="home" label="首頁" />
                                <NavItem id="news" label="最新消息" />
                                <NavItem id="lessons" label="教學課程" />
                                <NavItem id="about" label="品牌簡介" />
                                <NavItem id="products" label="產品系列" />
                                <NavItem id="service" label="售後服務" />
                            </div>
                            <div className="flex items-center gap-4 text-left">
                                <a href={`https://${SHOPIFY_DOMAIN}`} target="_blank" className="hidden md:flex bg-amber-600 hover:bg-amber-700 p-3 rounded-full font-black text-white text-sm shadow-lg">
                                    <LucideIcon name="ShoppingCart" size={18} /> <span className="ml-2 uppercase tracking-widest text-[10px]">進入商城</span>
                                </a>
                                <button onClick={() => setIsSidebarOpen(true)} className="lg:hidden p-2 text-stone-400"><LucideIcon name="Menu" size={28} /></button>
                            </div>
                        </div>
                    </nav>

                    {isSidebarOpen && <div className="fixed inset-0 bg-black/60 z-[60] md:hidden backdrop-blur-sm" onClick={() => setIsSidebarOpen(false)}></div>}
                    <aside className={`fixed top-0 right-0 h-full w-72 bg-stone-900 z-[70] shadow-2xl md:hidden sidebar-transition transform ${isSidebarOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                        <div className="flex flex-col h-full p-8 text-left">
                            <div className="flex justify-between items-center mb-12 text-left">
                                <span className="text-amber-500 font-bold tracking-widest uppercase italic text-left">功能導覽</span>
                                <button onClick={() => setIsSidebarOpen(false)} className="text-stone-400 hover:text-white text-left"><LucideIcon name="X" size={28} /></button>
                            </div>
                            <nav className="flex flex-col space-y-6 text-left">
                                {['home', 'news', 'lessons', 'about', 'products', 'service'].map(p => (
                                    <button key={p} onClick={() => changePage(p)} className={`text-xl font-bold tracking-widest uppercase text-left ${currentPage === p ? 'text-amber-500' : 'text-stone-300'}`}>
                                        {p === 'home' ? '首頁' : p === 'news' ? '最新消息' : p === 'lessons' ? '薩克斯風教學' : p === 'about' ? '品牌簡介' : p === 'products' ? '產品系列' : '售後服務'}
                                    </button>
                                ))}
                                <div className="pt-8 border-t border-stone-800 text-left">
                                    <button onClick={() => changePage('shipping')} className="text-stone-400 text-sm mb-4 block uppercase font-bold tracking-widest text-left">運送政策</button>
                                    <button onClick={() => changePage('return')} className="text-stone-400 text-sm block uppercase font-bold tracking-widest text-left">退換貨政策</button>
                                </div>
                            </nav>
                        </div>
                    </aside>

                    <main className="pt-20 flex-1">
                        {currentPage === 'home' && <HomePage onExplore={() => changePage('products')} />}
                        {currentPage === 'news' && <NewsPage newsData={newsData} loading={newsLoading} />}
                        {currentPage === 'lessons' && <LessonsPage />}
                        {currentPage === 'about' && <AboutSection />}
                        {currentPage === 'products' && <ProductsPage products={shopifyProducts} loading={loading} />}
                        {currentPage === 'service' && <ServicePage />}
                        {currentPage === 'shipping' && <PolicyPage title="運送政策 Shipping Policy" content="一般配件與耗材：於 TK SAXOPHONE 官網購買之配件、耗材類商品，依系統標示之基本運費計算。\n\n樂器類商品：由於薩克斯風屬於精密儀器且單價較高，樂器類商品限於「一中旗艦店」現場訂購。其運費將依據最終配送方式實報實銷。" />}
                        {currentPage === 'return' && <PolicyPage title="退換貨政策 Return Policy" content="一、七天鑑賞期與開箱存證\n於 TK SAXOPHONE 官方網站購買之商品，均享有商品到貨次日起七天內之鑑賞期（非試用期）。\n【重要提醒】 為保障雙方權益，請您在拆封包裹時全程錄影。" />}
                    </main>

                    <footer className="bg-stone-950 text-stone-500 py-16 mt-auto text-left">
                        <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12 text-left">
                            <div className="text-left">
                                <div className="flex items-center gap-4 mb-6 text-left"><img src="https://i.imgur.com/H7NWyZP.png" alt="TK SAXOPHONE Logo" className="h-8 opacity-90 text-left" /><span className="text-xl font-bold tracking-widest text-white italic uppercase text-nowrap text-left">TK SAXOPHONE</span></div>
                                <p className="text-sm font-light leading-relaxed text-left">傳承八十載台灣匠心，製作能與靈魂共鳴的薩克斯風。堅持 100% 台灣製造。</p>
                            </div>
                            <div className="text-left">
                                <h4 className="text-white font-bold text-sm tracking-widest uppercase mb-6 text-left">聯繫資訊</h4>
                                <div className="space-y-4 text-left">
                                    <div className="flex items-start gap-3 text-left">
                                        <LucideIcon name="MapPin" size={16} className="text-amber-500 mt-1 flex-shrink-0" />
                                        <div className="text-xs text-left">
                                            <p className="font-bold text-stone-200 text-left">TK SAXOPHONE 台中一中旗艦店</p>
                                            <p className="text-stone-400 mt-1 text-left">404臺中市北區一中街116巷28號</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3 text-left">
                                        <LucideIcon name="Phone" size={16} className="text-amber-500 flex-shrink-0" />
                                        <p className="font-bold text-stone-300 italic text-xs text-left">0911-375938 Easen</p>
                                    </div>
                                </div>
                            </div>
                            <div className="text-left">
                                <h4 className="text-white font-bold text-sm tracking-widest uppercase mb-6 text-left">顧客服務</h4>
                                <ul className="space-y-4 text-xs font-light text-left">
                                    <li><button onClick={() => changePage('shipping')} className="hover:text-amber-500 uppercase tracking-widest text-left">運送政策 Shipping Policy</button></li>
                                    <li><button onClick={() => changePage('return')} className="hover:text-amber-500 uppercase tracking-widest text-left">退換貨政策 Return Policy</button></li>
                                </ul>
                            </div>
                            <div className="text-left">
                                <h4 className="text-white font-bold text-sm tracking-widest uppercase mb-6 text-left">數據同步</h4>
                                <div className="flex items-center gap-2 text-[10px] font-bold italic text-green-500 uppercase text-left"><div className="w-2 h-2 rounded-full bg-green-500 animate-pulse text-left"></div>Shopify Sync Active</div>
                                <p className="text-[9px] text-stone-700 mt-4 text-left">© 2024 TK MELODY SAXOPHONE.</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        // --- 子組件：首頁 ---
        const HomePage = ({ onExplore }) => (
            <div className="animate-fade-in text-left">
                <section className="relative h-[85vh] flex items-center overflow-hidden text-left">
                    <div className="absolute inset-0 text-left">
                        <img src="https://i.imgur.com/3jRKwrH.jpeg" alt="TK SAXOPHONE 品牌形象圖 - 台灣製造頂級薩克斯風" className="w-full h-full object-cover shadow-2xl text-left" />
                        <div className="absolute inset-0 bg-stone-950/40"></div>
                    </div>
                    <div className="relative max-w-7xl mx-auto px-6 w-full text-left">
                        <div className="max-w-4xl space-y-8 text-left">
                            <div className="inline-block py-1 px-3 bg-amber-600 text-white text-[10px] font-black tracking-[0.4em] uppercase rounded shadow-lg text-left">Since 1946 Legacy</div>
                            <h1 className="text-5xl md:text-8xl font-black text-white leading-tight italic drop-shadow-2xl uppercase text-left">TK SAXOPHONE<br/><span className="text-amber-500 text-3xl md:text-6xl block mt-4 font-black text-left">傳承八十載的台灣匠心</span></h1>
                            <p className="text-lg md:text-xl text-stone-100 font-light max-w-2xl text-left">「八十年，我們只專心做好一件事：製作能與靈魂共鳴的薩克斯風。」</p>
                            <div className="pt-4 text-left"><button onClick={onExplore} className="px-8 md:px-10 py-4 md:py-5 bg-amber-600 text-white rounded-full font-black hover:bg-amber-700 transition shadow-2xl uppercase tracking-widest text-xs flex items-center gap-2 text-left">查看產品系列 <LucideIcon name="ChevronRight" size={18} /></button></div>
                        </div>
                    </div>
                </section>
                <section className="py-24 bg-stone-900 text-white text-left"><div className="max-w-7xl mx-auto px-6 text-left"><div className="text-center mb-20"><h2 className="text-4xl font-black italic mb-4 tracking-tight uppercase text-center">國際演奏家之選</h2><p className="text-stone-500 text-sm tracking-[0.2em] uppercase italic font-bold text-center">Trusted by World-Class Artists</p></div><div className="grid grid-cols-1 md:grid-cols-2 gap-12 text-left"><ArtistCard name="陳嘉俊 (Wilson Chen)" desc="其個人專屬「嘉」Model 系列在全球爵士圈享有盛譽。" img="https://i.imgur.com/QsOg9vX.jpeg" /><ArtistCard name="小林香織 (Kaori Kobayashi)" desc="多次巡迴演出指定使用 TK 系列產品。" img="https://i.imgur.com/MgniwDh.jpeg" /></div></div></section>
                
                <section className="py-24 bg-white text-center">
                    <div className="max-w-7xl mx-auto px-6 mb-16 text-center"><h2 className="text-4xl font-black italic mb-2 tracking-tight uppercase text-stone-900 text-center">精緻工藝細節</h2><div className="w-16 h-1 bg-amber-500 mx-auto mt-4"></div></div>
                    <div className="max-w-5xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-8 text-center">
                        {[
                            { id: "7h8Tm2w", alt: "TK 薩克斯風手工刻花細節" },
                            { id: "ub1b35l", alt: "TK 薩克斯風零件組裝工藝 - 后里匠心製作" },
                            { id: "aN0jyY4", alt: "薩克斯風管體拋光過程 - 台灣製造品質保證" },
                            { id: "mOrQ8ou", alt: "高品質薩克斯風墊片與按鍵維修零件" }
                        ].map((img, i) => (
                            <div key={img.id} className="aspect-[4/3] rounded-[2rem] overflow-hidden shadow-lg border border-stone-100 group text-center">
                                <img src={`https://i.imgur.com/${img.id}.jpeg`} alt={img.alt} className="w-full h-full object-cover group-hover:scale-110 transition duration-1000 text-center" />
                            </div>
                        ))}
                    </div>
                </section>
            </div>
        );

        // --- 子組件：教學課程 ---
        const LessonsPage = () => (
            <div className="max-w-6xl mx-auto px-6 py-24 animate-fade-in text-left">
                <div className="mb-20 text-center">
                    <h2 className="text-4xl md:text-5xl font-black italic mb-4 text-stone-900 uppercase tracking-tight text-center">薩克斯風專業教學</h2>
                    <p className="text-amber-600 font-bold tracking-[0.3em] uppercase italic text-center text-sm md:text-base">Master the Soul of Music: Professional Lessons</p>
                    <div className="w-20 h-1 bg-amber-500 mx-auto mt-6"></div>
                </div>

                <div className="grid lg:grid-cols-3 gap-10 items-stretch mb-24 text-left">
                    <div className="bg-white p-10 rounded-[2.5rem] shadow-sm border border-stone-100 flex flex-col hover:shadow-xl transition-shadow duration-500 text-left">
                        <div className="w-12 h-12 bg-amber-50 rounded-2xl flex items-center justify-center mb-8 text-left"><LucideIcon name="UserCheck" className="text-amber-600" size={28} /></div>
                        <h3 className="text-xl font-bold text-stone-900 mb-6 tracking-widest text-left">一對一極致教學</h3>
                        <p className="text-stone-500 leading-relaxed font-light flex-1 text-left">我們堅持採 <span className="font-bold text-stone-800 underline decoration-amber-500 decoration-2">一對一專業指導</span>。針對您的氣息、嘴型、指法與情感表達進行精準校正，讓學習進度事半功倍。</p>
                    </div>

                    <div className="bg-white p-10 rounded-[2.5rem] shadow-sm border border-stone-100 flex flex-col hover:shadow-xl transition-shadow duration-500 text-left">
                        <div className="w-12 h-12 bg-amber-50 rounded-2xl flex items-center justify-center mb-8 text-left"><LucideIcon name="MapPin" className="text-amber-600" size={28} /></div>
                        <h3 className="text-xl font-bold text-stone-900 mb-6 tracking-widest text-left">旗艦店專業環境</h3>
                        <div className="flex-1 text-left">
                            <p className="text-stone-800 font-bold text-base mb-2 text-left">TK SAXOPHONE 台中一中旗艦店</p>
                            <p className="text-amber-600 font-bold text-sm mb-4 italic uppercase tracking-widest text-left">404臺中市北區一中街116巷28號</p>
                            <p className="text-stone-500 leading-relaxed font-light text-left">在專業試奏隔音空間中學習，環境優雅舒適。現場亦有樂器、吹嘴、竹片可供租借使用。</p>
                        </div>
                    </div>
