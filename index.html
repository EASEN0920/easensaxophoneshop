<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.K. SAXOPHONE | 傳承八十載的台灣匠心</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 核心與 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Lucide 圖示 (使用全域版以確保相容性) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 引入 Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100;300;400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; overflow-x: hidden; }
        .animate-fade-in { animation: fadeIn 1.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* 滾動條美化 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #78716c; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- 1. 配置與初始化 ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "",
            authDomain: "",
            projectId: "",
            storageBucket: "",
            messagingSenderId: "",
            appId: ""
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'tk-sax-default';

        if (firebaseConfig.apiKey) {
            firebase.initializeApp(firebaseConfig);
        }

        const { useState, useEffect, useRef } = React;

        // --- 2. 圖示組件橋接器 ---
        // 解決 CDN 環境下 React 組件存取問題，手動建立圖示包裝
        const LucideIcon = ({ name, size = 24, className = "", ...props }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    // 清空之前的內容
                    iconRef.current.innerHTML = '';
                    // 建立圖示
                    const icon = lucide.createIcons({
                        icons: { [name]: lucide.icons[name] },
                        attrs: { 
                            stroke: 'currentColor', 
                            'stroke-width': 2,
                            width: size,
                            height: size,
                            class: className
                        }
                    });
                }
            }, [name, size, className]);

            return <span ref={iconRef} className="inline-block leading-none" {...props}></span>;
        };

        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [showAdmin, setShowAdmin] = useState(false);
            const [adminClickCount, setAdminClickCount] = useState(0);
            const [products, setProducts] = useState([]);
            const [loading, setLoading] = useState(true);

            // 預設備份資料
            const defaultProducts = [
                { 
                    id: '1', 
                    name: 'TK.SAXOPHONE 傳奇中音 ALTO SAX', 
                    price: 72000, 
                    img: 'https://i.imgur.com/f3sTY2J.jpeg', 
                    url: 'https://t27v5glqel.cashier.ecpay.com.tw/product/000000000908931' 
                },
                { 
                    id: '2', 
                    name: 'TK.Saxophone 雅柏次中音 Tenor Sax', 
                    price: 120000, 
                    img: 'https://i.imgur.com/syUBobO.jpeg', 
                    url: 'https://t27v5glqel.cashier.ecpay.com.tw/product/000000000908930' 
                }
            ];

            useEffect(() => {
                // 如果沒有提供真實 API Key，則使用預設商品
                if (!firebaseConfig.apiKey) {
                    setTimeout(() => {
                        setProducts(defaultProducts);
                        setLoading(false);
                    }, 800);
                    return;
                }

                // RULE 3: Auth Before Queries
                firebase.auth().signInAnonymously().then(cred => {
                    const db = firebase.firestore();
                    // RULE 1: Strict Paths
                    const productsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products');
                    
                    return productsRef.onSnapshot((snapshot) => {
                        const productList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setProducts(productList.length > 0 ? productList : defaultProducts);
                        setLoading(false);
                    }, (err) => {
                        console.error("Firestore sync error:", err);
                        setProducts(defaultProducts);
                        setLoading(false);
                    });
                });
            }, []);

            const handleAdminTrigger = () => {
                const newCount = adminClickCount + 1;
                setAdminClickCount(newCount);
                if (newCount >= 3) {
                    setShowAdmin(true);
                    setAdminClickCount(0);
                }
            };

            return (
                <div className="min-h-screen bg-stone-50 text-stone-900 selection:bg-amber-200 flex flex-col">
                    {/* 導航欄 */}
                    <nav className="fixed w-full z-50 bg-stone-900/95 text-white backdrop-blur-md border-b border-stone-800">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
                            <div className="flex items-center gap-4 cursor-pointer" onClick={() => setCurrentPage('home')}>
                                <img src="https://i.imgur.com/H7NWyZP.png" alt="TK Logo" className="h-10 w-auto" />
                                <div className="flex flex-col border-l border-stone-700 pl-4">
                                    <span className="text-xl font-bold tracking-widest text-amber-500 italic leading-none uppercase">TK SAXOPHONE</span>
                                    <span className="text-[9px] tracking-[0.2em] text-stone-400 font-bold uppercase mt-1 text-nowrap">傳承三代 | 100% 台灣製造</span>
                                </div>
                            </div>
                            
                            <div className="hidden md:flex space-x-10 text-xs font-bold tracking-widest uppercase">
                                <button onClick={() => setCurrentPage('home')} className={`transition ${currentPage === 'home' ? 'text-amber-500' : 'hover:text-amber-400'}`}>首頁</button>
                                <button onClick={() => setCurrentPage('about')} className={`transition ${currentPage === 'about' ? 'text-amber-500' : 'hover:text-amber-400'}`}>品牌簡介</button>
                                <button onClick={() => setCurrentPage('products')} className={`transition ${currentPage === 'products' ? 'text-amber-500' : 'hover:text-amber-400'}`}>產品系列</button>
                                <button onClick={() => setCurrentPage('service')} className={`transition ${currentPage === 'service' ? 'text-amber-500' : 'hover:text-amber-400'}`}>售後服務</button>
                            </div>

                            <div className="flex items-center gap-4">
                                <a href="https://t27v5glqel.cashier.ecpay.com.tw" target="_blank" className="p-2 hover:bg-stone-800 rounded-full transition flex items-center gap-2 text-xs font-bold">
                                    <LucideIcon name="ShoppingCart" size={22} className="text-amber-500" />
                                    <span className="hidden sm:inline uppercase tracking-widest text-white">進入商城</span>
                                </a>
                                {showAdmin && (
                                    <button onClick={() => setCurrentPage('admin')} className="p-2 bg-amber-600 rounded-full animate-pulse text-white shadow-lg">
                                        <LucideIcon name="Settings" size={20} />
                                    </button>
                                )}
                            </div>
                        </div>
                    </nav>

                    <main className="pt-20 flex-1">
                        {currentPage === 'home' && <HomePage onExplore={() => setCurrentPage('products')} />}
                        {currentPage === 'about' && <AboutSection />}
                        {currentPage === 'products' && <ProductsPage products={products} loading={loading} />}
                        {currentPage === 'service' && <ServicePage />}
                        {currentPage === 'admin' && <AdminPanel onClose={() => setCurrentPage('products')} appId={appId} />}

                    <footer className="bg-stone-950 text-stone-500 py-16 border-t border-stone-900 mt-auto">
                        <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-4 gap-12 text-left">
                            <div className="col-span-2">
                                <div className="flex items-center gap-4 mb-6">

                                   <span className="text-xl font-bold tracking-widest text-white italic uppercase">TK SAXOPHONE</span>
                                </div>
                                <p className="text-sm leading-relaxed max-w-sm">
                                    八十年，我們只專心做好一件事：製作能與靈魂共鳴的薩克斯風。堅持 100% 台灣製造，守護職人工藝。
                                </p>
                            </div>
                            <div>
                                <h4 className="text-white font-bold text-sm tracking-widest uppercase mb-6">聯繫資訊</h4>
                                <div className="space-y-4 text-xs">
                                    <p className="flex items-start gap-2 leading-relaxed font-bold text-stone-300 italic underline underline-offset-4 decoration-amber-500 cursor-pointer">0911-375938 Easen</p>
                                    <p className="flex items-start gap-2 leading-relaxed"><LucideIcon name="MapPin" size={16} className="text-amber-500 flex-shrink-0" /> 台中旗艦店</p>
                                </div>
                            </div>
                            <div>
                                <h4 onClick={handleAdminTrigger} className="text-white font-bold text-sm tracking-widest uppercase mb-6 cursor-default select-none">購物保障</h4>
                                <div className="space-y-3">

                                </div>
                            </div>
                        </div>
                    </footer>

                </section>

                <section className="py-24 bg-white text-left overflow-hidden">
                    <div className="max-w-7xl mx-auto px-6">
                        <div className="grid md:grid-cols-2 gap-16 items-center">
                            <div className="space-y-8">
                                <h2 className="text-4xl font-black text-stone-900 italic tracking-tight">品牌簡介</h2>

                                <div className="space-y-6 text-stone-600 leading-relaxed text-lg font-light">
                                    <p>來自台灣的 <span className="font-bold text-stone-800">T.K. SAXOPHONE</span>，擁有超過 <span className="font-bold text-amber-700">80 年</span> 的專業製造底蘊。我們不僅深耕在地，更堅持 100% 台灣製造與銷售。</p>
                                    <p>我們將每一把樂器視為「感性」與「創造性」的完美結合，致力於雕琢出能捕捉演奏者微妙情緒的高品質薩克斯風。</p>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 pt-4 text-left">
                                    <div className="space-y-2">
                                        <div className="flex items-center gap-2 text-stone-900 font-bold uppercase"><LucideIcon name="Hammer" size={18} className="text-amber-600" /> 深厚工藝底蘊</div>
                                        <p className="text-xs text-stone-400 leading-relaxed">跨越八十年的技術，融合傳統手工敲打與現代精密聲學科技。</p>
                                    </div>
                                    <div className="space-y-2">
                                        <div className="flex items-center gap-2 text-stone-900 font-bold uppercase"><LucideIcon name="Award" size={18} className="text-amber-600" /> 頂級選材標準</div>
                                        <p className="text-xs text-stone-400 leading-relaxed">嚴選德國進口黃銅與義大利高級皮墊，確保每一聲共鳴紮實溫潤。</p>
                                    </div>
                                </div>
                            </div>
                            <div className="relative group">
                                <img src="https://i.imgur.com/DTuYgcN.jpeg" className="rounded-3xl shadow-2xl transition duration-700 group-hover:scale-[1.02]" alt="TK 工藝細節" />
                                <div className="absolute -bottom-6 -right-6 w-32 h-32 bg-amber-500/10 rounded-full blur-3xl -z-10"></div>
                            </div>
                        </div>
                    </div>
                </section>

                <section className="py-24 bg-stone-900 text-white overflow-hidden text-left">
                    <div className="max-w-7xl mx-auto px-6">
                        <div className="text-center mb-20">
                            <h2 className="text-4xl font-black italic mb-4 tracking-tight">國際演奏家之選</h2>
                            <p className="text-stone-500 text-sm tracking-[0.2em] uppercase italic font-bold">Trusted by World-Class Artists</p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                            <div className="relative group bg-stone-800/50 rounded-[40px] overflow-hidden flex flex-col shadow-2xl">
                                <div className="h-[500px] w-full bg-stone-900">
                                    <img src="https://i.imgur.com/QsOg9vX.jpeg" alt="陳嘉俊" className="w-full h-full object-contain object-bottom transition duration-1000 group-hover:scale-105" />
                                </div>

                                    <p className="text-stone-300 font-light max-w-sm text-sm leading-relaxed">其個人專屬「嘉」Model 系列在全球爵士圈享有盛譽。</p>
                                </div>
                            </div>
                            <div className="relative group bg-stone-800/50 rounded-[40px] overflow-hidden flex flex-col shadow-2xl">
                                <div className="h-[500px] w-full bg-stone-900">
                                    <img src="https://i.imgur.com/MgniwDh.jpeg" alt="小林香織" className="w-full h-full object-contain object-bottom transition duration-1000 group-hover:scale-105" />
                                </div>
                                <div className="absolute inset-x-0 bottom-0 p-10 bg-gradient-to-t from-stone-950 via-stone-950/60 to-transparent">
                                    <span className="text-[10px] font-black text-amber-500 tracking-[0.4em] uppercase mb-3 block italic">Saxophone Queen</span>
                                    <h4 className="text-4xl font-black mb-4 italic">小林香織 (Kaori Kobayashi)</h4>

                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section className="py-24 bg-white">
                    <div className="max-w-7xl mx-auto px-6 text-center mb-16">
                        <h2 className="text-4xl font-black italic mb-2 tracking-tight uppercase">精緻工藝細節</h2>
                        <div className="w-16 h-1 bg-amber-500 mx-auto mt-4"></div>
                    </div>
                    <div className="max-w-5xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-8">
                        {["https://i.imgur.com/7h8Tm2w.jpeg", "https://i.imgur.com/ub1b35l.jpeg", "https://i.imgur.com/aN0jyY4.jpeg", "https://i.imgur.com/mOrQ8ou.jpeg"].map((img, i) => (

                        ))}
                    </div>

        );

                    <p className="text-2xl font-black mb-4 tracking-widest italic tracking-tighter text-nowrap underline decoration-amber-500 decoration-4 underline-offset-8">0911-375938</p>
                    <p className="text-stone-400 font-light mb-12 uppercase tracking-[0.3em] text-xs">專人服務：Easen</p>
                    <button className="px-10 py-4 bg-amber-600 rounded-full font-bold hover:bg-amber-700 transition tracking-widest uppercase text-xs shadow-xl active:scale-95">預約專業維修校正</button>
                </div>
            </div>
        );

        const AdminPanel = ({ onClose, appId }) => {
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [form, setForm] = useState({ name: '', price: '', img: '', url: '' });

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!firebaseConfig.apiKey) {
                    alert("目前為展示模式。要在 GitHub Pages 使用同步功能，請先在程式碼中填寫真實的 Firebase API Key。");
                    return;
                }
                setIsSubmitting(true);
                try {
                    const db = firebase.firestore();
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products').add({
                        ...form,
                        price: Number(form.price),
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setForm({ name: '', price: '', img: '', url: '' });
                    alert("商品已同步上架至雲端！");
                } catch (err) {
                    alert("上架失敗：" + err.message);
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="max-w-4xl mx-auto px-6 py-20 animate-fade-in text-left min-h-[60vh]">
                    <div className="flex justify-between items-center mb-10 border-b border-stone-200 pb-6">
                        <h2 className="text-2xl font-black italic flex items-center gap-3"><LucideIcon name="Settings" className="text-amber-600" /> 雲端管理中心</h2>
                        <button onClick={onClose} className="text-xs font-bold text-stone-400 hover:text-stone-900 uppercase tracking-widest px-4 py-2 border rounded-full">返回</button>
                    </div>
                    
                    <div className="bg-white p-10 rounded-[32px] border border-stone-100 shadow-xl mb-12">
                        <h3 className="font-bold mb-8 italic border-l-4 border-amber-600 pl-4 uppercase tracking-widest">同步新商品至網頁</h3>
                        <form onSubmit={handleSubmit} className="grid md:grid-cols-2 gap-8">
                            <div className="space-y-2">
                                <label className="text-[10px] font-bold text-stone-400 uppercase tracking-widest">商品名稱</label>
                                <input required value={form.name} onChange={e => setForm({...form, name: e.target.value})} className="w-full bg-stone-50 border border-stone-200 p-4 rounded-2xl text-sm focus:ring-2 focus:ring-amber-500 outline-none transition" placeholder="例如: TK Legend ALTO SAX" />
                            </div>
                            <div className="space-y-2">
                                <label className="text-[10px] font-bold text-stone-400 uppercase tracking-widest">價格 (數字)</label>
                                <input required type="number" value={form.price} onChange={e => setForm({...form, price: e.target.value})} className="w-full bg-stone-50 border border-stone-200 p-4 rounded-2xl text-sm focus:ring-2 focus:ring-amber-500 outline-none transition" placeholder="72000" />
                            </div>
                            <div className="space-y-2">
                                <label className="text-[10px] font-bold text-stone-400 uppercase tracking-widest">綠界商品 URL</label>
                                <input required value={form.url} onChange={e => setForm({...form, url: e.target.value})} className="w-full bg-stone-50 border border-stone-200 p-4 rounded-2xl text-sm focus:ring-2 focus:ring-amber-500 outline-none transition" placeholder="https://t27v5glqel.cashier..." />
                            </div>
                            <div className="space-y-2">
                                <label className="text-[10px] font-bold text-stone-400 uppercase tracking-widest">圖片連結 (Imgur)</label>
                                <input required value={form.img} onChange={e => setForm({...form, img: e.target.value})} className="w-full bg-stone-50 border border-stone-200 p-4 rounded-2xl text-sm focus:ring-2 focus:ring-amber-500 outline-none transition" placeholder="https://i.imgur.com/..." />
                            </div>
                            <button disabled={isSubmitting} className="md:col-span-2 py-5 bg-stone-900 text-white rounded-2xl font-black uppercase text-xs flex justify-center items-center gap-3 hover:bg-amber-600 transition shadow-lg disabled:bg-stone-300">
                                {isSubmitting ? <LucideIcon name="Loader2" className="animate-spin" size={16} /> : <LucideIcon name="Save" size={16} />} 立即發佈至官網
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // 渲染應用程式
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
