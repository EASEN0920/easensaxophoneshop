<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.K. SAXOPHONE | 傳承八十載的台灣匠心</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100;300;400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fafaf9; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .sidebar-transition { transition: transform 0.3s ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyCLedFsORsopOzUhtto5kr8WfEnM28Bh8k",
            authDomain: "tk-saxophone.firebaseapp.com",
            projectId: "tk-saxophone",
            storageBucket: "tk-saxophone.firebasestorage.app",
            messagingSenderId: "64364188077",
            appId: "1:64364188077:web:774938ea6f09f351c39124",
            measurementId: "G-VT59B60JMH"
        };
        const appId = 'tk-saxophone-web';

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const SHOPIFY_DOMAIN = 'tk-saxophone.myshopify.com';
        const SHOPIFY_TOKEN = '6992f8d32d2f2b395e09519c2760f80f';

        const LucideIcon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    const iconName = name.charAt(0).toLowerCase() + name.slice(1).replace(/[A-Z]/g, l => `-${l.toLowerCase()}`);
                    iconRef.current.setAttribute('data-lucide', iconName);
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i ref={iconRef} style={{ width: size, height: size, display: 'inline-block' }} className={className}></i>;
        };

        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [shopifyProducts, setShopifyProducts] = useState([]);
            const [newsData, setNewsData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [newsLoading, setNewsLoading] = useState(true);
            const [user, setUser] = useState(null);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [adminClickCount, setAdminClickCount] = useState(0);
            const [showAdmin, setShowAdmin] = useState(false);

            useEffect(() => {
                const init = async () => {
                    try {
                        const userCred = await auth.signInAnonymously();
                        setUser(userCred.user);
                        
                        // 讀取資料庫 (使用 artifacts/appId/public/data/news 路徑)
                        const newsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('news');
                        return newsRef.onSnapshot(snapshot => {
                            const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setNewsData(list.sort((a, b) => b.date.localeCompare(a.date)));
                            setNewsLoading(false);
                        }, err => {
                            console.error("Firestore Error:", err);
                            setNewsLoading(false);
                        });
                    } catch (error) {
                        console.error("Auth Error:", error);
                        setNewsLoading(false);
                    }
                };
                const unsubPromise = init();
                return () => unsubPromise.then(unsub => unsub && unsub());
            }, []);

            useEffect(() => {
                const fetchShopify = async () => {
                    const gqlQuery = `{ products(first: 20) { edges { node { id title handle priceRange { minVariantPrice { amount } } images(first: 1) { edges { node { url } } } } } } }`;
                    try {
                        const response = await fetch(`https://${SHOPIFY_DOMAIN}/api/2024-01/graphql.json`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'X-Shopify-Storefront-Access-Token': SHOPIFY_TOKEN },
                            body: JSON.stringify({ query: gqlQuery }),
                        });
                        const result = await response.json();
                        if (result.data) {
                            setShopifyProducts(result.data.products.edges.map(edge => ({
                                id: edge.node.id, name: edge.node.title, price: edge.node.priceRange.minVariantPrice.amount,
                                img: edge.node.images.edges[0]?.node.url || 'https://i.imgur.com/f3sTY2J.jpeg',
                                url: `https://${SHOPIFY_DOMAIN}/products/${edge.node.handle}`,
                                hidePrice: edge.node.title.includes('傳奇') || edge.node.title.includes('雅柏')
                            })));
                        }
                    } catch (e) {} finally { setLoading(false); }
                };
                fetchShopify();
            }, []);

            const addNews = async (news) => {
                if (!user) { alert("尚未連線至伺服器"); return; }
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('news').add({
                        ...news,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (e) { alert("發佈失敗，請檢查 Firebase 規則：" + e.message); }
            };

            const deleteNews = async (id) => {
                try { await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('news').doc(id).delete(); } catch (e) {}
            };

            const changePage = (page) => { setCurrentPage(page); setIsSidebarOpen(false); window.scrollTo(0, 0); };

            const handleAdminTrigger = () => {
                const newCount = adminClickCount + 1;
                setAdminClickCount(newCount);
                if (newCount >= 3) { setShowAdmin(true); setAdminClickCount(0); }
            };

            return (
                <div className="min-h-screen flex flex-col bg-stone-50 text-left">
                    {/* 手機選單遮罩 */}
                    {isSidebarOpen && <div className="fixed inset-0 bg-black/60 z-[60] md:hidden backdrop-blur-sm" onClick={() => setIsSidebarOpen(false)}></div>}

                    {/* 導航欄 */}
                    <nav className="fixed w-full z-50 bg-stone-900/95 text-white backdrop-blur-md border-b border-stone-800 shadow-xl">
                        <div className="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center text-left">
                            <div className="flex items-center gap-4 cursor-pointer" onClick={() => changePage('home')}>
                                <img src="https://i.imgur.com/H7NWyZP.png" alt="TK Logo" className="h-10 w-auto" />
                                <div className="flex flex-col border-l border-stone-700 pl-4 leading-tight">
                                    <span className="text-lg md:text-xl font-bold tracking-widest text-amber-500 italic leading-none uppercase">TK SAXOPHONE</span>
                                    <span className="text-[9px] tracking-[0.2em] text-stone-400 font-bold uppercase mt-1 text-nowrap">100% 台灣製造</span>
                                </div>
                            </div>
                            <div className="hidden lg:flex space-x-10 text-base font-bold tracking-widest uppercase">
                                {['home', 'news', 'about', 'products', 'service'].map(p => (
                                    <button key={p} onClick={() => changePage(p)} className={currentPage === p ? 'text-amber-500' : 'hover:text-stone-300 transition'}>
                                        {p === 'home' ? '首頁' : p === 'news' ? '最新消息' : p === 'about' ? '品牌簡介' : p === 'products' ? '產品系列' : '售後服務'}
                                    </button>
                                ))}
                            </div>
                            <div className="flex items-center gap-4">
                                <a href={`https://${SHOPIFY_DOMAIN}`} target="_blank" className="hidden md:flex bg-amber-600 hover:bg-amber-700 p-3 rounded-full font-black text-white text-sm shadow-lg">
                                    <LucideIcon name="ShoppingCart" size={18} /> <span className="ml-2 uppercase tracking-widest text-[10px]">進入商城</span>
                                </a>
                                <button onClick={() => setIsSidebarOpen(true)} className="lg:hidden p-2 text-stone-400"><LucideIcon name="Menu" size={28} /></button>
                                {showAdmin && <button onClick={() => changePage('admin')} className="p-2 bg-stone-700 rounded-full text-amber-500 animate-pulse"><LucideIcon name="Settings" size={20} /></button>}
                            </div>
                        </div>
                    </nav>

                    <main className="pt-20 flex-1">
                        {currentPage === 'home' && <HomePage onExplore={() => changePage('products')} />}
                        {currentPage === 'news' && <NewsPage newsData={newsData} loading={newsLoading} />}
                        {currentPage === 'about' && <AboutSection />}
                        {currentPage === 'products' && <ProductsPage products={shopifyProducts} loading={loading} />}
                        {currentPage === 'service' && <ServicePage />}
                        {currentPage === 'admin' && <AdminPanel newsData={newsData} onAddNews={addNews} onDeleteNews={deleteNews} onClose={() => changePage('home')} />}
                    </main>

                    <footer className="bg-stone-950 text-stone-500 py-16 mt-auto text-left">
                        <div className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12">
                            <div>
                                <div className="flex items-center gap-4 mb-6"><img src="https://i.imgur.com/H7NWyZP.png" alt="Logo" className="h-8 opacity-90" /><span className="text-xl font-bold tracking-widest text-white italic uppercase">TK SAXOPHONE</span></div>
                                <p className="text-sm font-light">八十年，我們只專心做好一件事：製作能與靈魂共鳴的薩克斯風。堅持 100% 台灣製造。</p>
                            </div>
                            <div>
                                <h4 className="text-white font-bold text-sm tracking-widest uppercase mb-6">聯繫資訊</h4>
                                <p className="font-bold text-stone-300 italic mb-4">0911-375938 Easen</p>
                                <div className="flex items-center gap-4 pt-4 border-t border-stone-900">
                                    <a href="https://www.facebook.com/tksaxophone1948/" target="_blank" className="p-2 bg-stone-900 rounded-full hover:bg-blue-600 transition shadow-xl"><LucideIcon name="Facebook" size={18} /></a>
                                    <a href="https://www.instagram.com/tk_saxophone" target="_blank" className="p-2 bg-stone-900 rounded-full hover:bg-pink-600 transition shadow-xl"><LucideIcon name="Instagram" size={18} /></a>
                                    <a href="https://www.youtube.com/@tksaxophone1948" target="_blank" className="p-2 bg-stone-900 rounded-full hover:bg-red-600 transition shadow-xl"><LucideIcon name="Youtube" size={18} /></a>
                                </div>
                            </div>
                            <div>
                                <h4 onClick={handleAdminTrigger} className="text-white font-bold text-sm tracking-widest uppercase mb-6 cursor-default active:text-amber-500 transition-colors">數據同步</h4>
                                <div className="flex items-center gap-2 text-[10px] font-bold italic text-green-500 uppercase"><div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>Shopify Sync Active</div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        // --- 子組件 ---
        const HomePage = ({ onExplore }) => (
            <div className="animate-fade-in text-left">
                <section className="relative h-[85vh] flex items-center overflow-hidden"><div className="absolute inset-0"><img src="https://i.imgur.com/3jRKwrH.jpeg" className="w-full h-full object-cover shadow-2xl" /><div className="absolute inset-0 bg-stone-950/40"></div></div><div className="relative max-w-7xl mx-auto px-6 w-full text-left"><div className="max-w-4xl space-y-8"><div className="inline-block py-1 px-3 bg-amber-600 text-white text-[10px] font-black tracking-[0.4em] uppercase rounded shadow-lg text-left">Since 1946 Legacy</div><h1 className="text-5xl md:text-8xl font-black text-white leading-tight italic drop-shadow-2xl uppercase">T.K. SAXOPHONE<br/><span className="text-amber-500 text-3xl md:text-6xl block mt-4 font-black">傳承八十載的台灣匠心</span></h1><p className="text-lg md:text-xl text-stone-100 font-light max-w-2xl">「八十年，我們只專心做好一件事：製作能與靈魂共鳴的薩克斯風。」</p><div className="pt-4"><button onClick={onExplore} className="px-8 md:px-10 py-4 md:py-5 bg-amber-600 text-white rounded-full font-black hover:bg-amber-700 transition shadow-2xl uppercase tracking-widest text-xs flex items-center gap-2 text-left">查看產品系列 <LucideIcon name="ChevronRight" size={18} /></button></div></div></div></section>
                <section className="py-24 bg-stone-900 text-white text-left"><div className="max-w-7xl mx-auto px-6"><div className="text-center mb-20"><h2 className="text-4xl font-black italic mb-4 tracking-tight uppercase">國際演奏家之選</h2><p className="text-stone-500 text-sm tracking-[0.2em] uppercase italic font-bold">Trusted by World-Class Artists</p></div><div className="grid grid-cols-1 md:grid-cols-2 gap-12 text-left text-left text-left text-left text-left"><ArtistCard name="陳嘉俊 (Wilson Chen)" desc="其個人專屬「嘉」Model 系列在全球爵士圈享有盛譽。" img="https://i.imgur.com/QsOg9vX.jpeg" /><ArtistCard name="小林香織 (Kaori Kobayashi)" desc="多次巡迴演出指定使用 TK 系列產品。" img="https://i.imgur.com/MgniwDh.jpeg" /></div></div></section>
            </div>
        );

        const ArtistCard = ({ name, desc, img }) => (
            <div className="relative group bg-stone-800/50 rounded-[2.5rem] overflow-hidden flex flex-col shadow-2xl text-left"><div className="h-[500px] bg-stone-900"><img src={img} className="w-full h-full object-contain object-bottom transition duration-1000 group-hover:scale-105" /></div><div className="absolute inset-x-0 bottom-0 p-10 bg-gradient-to-t from-stone-950 via-stone-950/60 to-transparent"><h4 className="text-4xl font-black mb-4 italic uppercase text-left">{name}</h4><p className="text-stone-300 font-light text-sm leading-relaxed text-left">{desc}</p></div></div>
        );

        const NewsPage = ({ newsData, loading }) => (
            <div className="max-w-4xl mx-auto px-6 py-24 animate-fade-in text-left min-h-[60vh] text-left text-left">
                <div className="mb-16 text-center text-center"><h2 className="text-4xl font-black italic mb-4 text-stone-900 uppercase">最新消息 News</h2><div className="w-16 h-1 bg-amber-500 mx-auto"></div></div>
                {loading ? (<div className="text-center py-20 text-stone-400"><LucideIcon name="Loader2" className="animate-spin text-amber-500 mx-auto mb-4" size={48} />連線資料庫中...</div>) : newsData.length === 0 ? (<p className="text-center text-stone-400 italic">目前尚無最新消息</p>) : (
                    <div className="space-y-10">{newsData.map(item => (<div key={item.id} className="bg-white p-10 rounded-[2.5rem] shadow-sm border border-stone-100 flex flex-col gap-6 group hover:shadow-md transition text-left text-left text-left text-left"><div className="flex justify-between items-start text-left"><div className="flex items-center gap-3"><span className="text-amber-600 font-bold text-sm tracking-widest">{item.date}</span><div className="text-[10px] uppercase font-black bg-stone-100 text-stone-500 px-3 py-1 rounded-full">{item.category}</div></div><LucideIcon name="Volume2" size={18} className="text-stone-200 group-hover:text-amber-500 transition" /></div><div className="space-y-4 text-left"><h3 className="text-2xl font-bold text-stone-900 leading-tight text-left">{item.title}</h3><p className="text-stone-500 font-light leading-relaxed whitespace-pre-wrap text-left">{item.content}</p></div></div>))}</div>
                )}
            </div>
        );

        const ProductsPage = ({ products, loading }) => (
            <div className="max-w-7xl mx-auto px-6 py-20 text-left min-h-[60vh] text-left text-left text-left">
                <div className="text-center mb-16 text-center text-center"><h2 className="text-4xl font-black italic mb-4 tracking-tight uppercase text-stone-900">旗艦系列商品</h2><p className="text-stone-400 font-light italic text-center">官方商店實時同步</p></div>
                {loading ? <div className="text-center py-20"><LucideIcon name="Loader2" className="animate-spin text-amber-500 mx-auto" size={48} /></div> : (
                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8 text-left">{products.map(p => (<div key={p.id} className="bg-white rounded-[2rem] overflow-hidden border border-stone-100 shadow-sm hover:shadow-xl transition flex flex-col h-full group text-left"><div className="aspect-square bg-stone-50 overflow-hidden relative"><img src={p.img} className="w-full h-full object-cover group-hover:scale-110 transition duration-700" /></div><div className="p-8 flex flex-col flex-1 text-left"><h3 className="font-bold text-sm mb-2 h-10 line-clamp-2 uppercase leading-tight text-left text-left">{p.name}</h3>{!p.hidePrice && <p className="text-amber-700 font-black text-xl mb-6 italic text-left text-left">NT$ {Number(p.price).toLocaleString()}</p>}<a href={p.url} target="_blank" className="mt-auto w-full py-3 bg-stone-900 text-white rounded-xl text-[10px] font-black tracking-widest uppercase hover:bg-amber-600 transition flex items-center justify-center gap-2 shadow-lg text-center">立即購買 <LucideIcon name="ExternalLink" size={14} /></a></div></div>))}</div>
                )}
            </div>
        );

        const AdminPanel = ({ newsData, onAddNews, onDeleteNews, onClose }) => {
            const [form, setForm] = useState({ title: '', content: '', date: new Date().toISOString().split('T')[0].replace(/-/g, '.'), category: '品牌公告' });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const handleSubmit = async (e) => { e.preventDefault(); setIsSubmitting(true); try { await onAddNews(form); setForm({ ...form, title: '', content: '' }); } finally { setIsSubmitting(false); } };
            return (
                <div className="max-w-6xl mx-auto px-6 py-20 text-left min-h-[80vh] text-left text-left text-left">
                    <div className="flex justify-between items-center mb-10 border-b pb-6 text-left"><h2 className="text-2xl font-black italic uppercase text-stone-900 flex items-center gap-2"><LucideIcon name="Settings" className="text-amber-600" /> 管理員中心</h2><button onClick={onClose} className="text-xs font-bold border px-4 py-2 rounded-full uppercase">返回首頁</button></div>
                    <div className="grid lg:grid-cols-12 gap-12 text-left"><div className="lg:col-span-7 bg-white p-10 rounded-[3rem] shadow-sm border border-stone-100 text-left"><h3 className="font-black italic text-stone-900 mb-8 flex items-center gap-2 uppercase text-left"><LucideIcon name="PlusCircle" size={18} className="text-amber-600"/> 發佈雲端消息</h3><form onSubmit={handleSubmit} className="space-y-6 text-left text-left"><div className="text-left text-left text-left text-left text-left"><label className="text-[10px] font-bold text-stone-400 uppercase tracking-widest block mb-2 text-left">消息標題</label><input required value={form.title} onChange={e => setForm({...form, title: e.target.value})} className="w-full bg-stone-50 border p-4 rounded-2xl outline-none focus:ring-2 focus:ring-amber-500 transition text-left" placeholder="輸入標題..." /></div><div className="grid grid-cols-2 gap-6 text-left text-left"><div className="text-left"><label className="text-[10px] font-bold text-stone-400 uppercase tracking-widest block mb-2 text-left">日期 (YYYY.MM.DD)</label><input required value={form.date} onChange={e => setForm({...form, date: e.target.value})} className="w-full bg-stone-50 border p-4 rounded-2xl outline-none text-left" /></div><div className="text-left"><label className="text-[10px] font-bold text-stone-400 uppercase tracking-widest block mb-2 text-left">分類標籤</label><select value={form.category} onChange={e => setForm({...form, category: e.target.value})} className="w-full bg-stone-50 border p-4 rounded-2xl outline-none text-left"><option>品牌公告</option><option>活動資訊</option><option>維修服務</option></select></div></div><div className="text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left text-left"><label className="text-[10px] font-bold text-stone-400 uppercase tracking-widest block mb-2 text-left">詳細內容</label><textarea required rows="6" value={form.content} onChange={e => setForm({...form, content: e.target.value})} className="w-full bg-stone-50 border p-4 rounded-2xl outline-none focus:ring-2 focus:ring-amber-500 transition leading-relaxed text-left text-left text-left text-left text-left text-left text-left text-left text-left" placeholder="填寫詳細內容..."></textarea></div><button disabled={isSubmitting} className="w-full py-5 bg-stone-900 text-white rounded-2xl font-black uppercase text-xs hover:bg-amber-600 transition shadow-lg flex justify-center items-center gap-2">{isSubmitting ? <LucideIcon name="Loader2" className="animate-spin" size={16}/> : <LucideIcon name="Save" size={16}/>} {isSubmitting ? "同步中..." : "發佈並永久保存"}</button></form></div><div className="lg:col-span-5 space-y-6 text-left"><h3 className="font-black italic text-stone-900 uppercase tracking-widest text-left">雲端管理 ({newsData.length})</h3><div className="max-h-[600px] overflow-y-auto pr-2 space-y-4 text-left">{newsData.map(item => (<div key={item.id} className="bg-white p-5 rounded-2xl border border-stone-100 flex justify-between items-center group shadow-sm text-left"><div className="truncate pr-4 text-left"><div className="text-[10px] text-amber-600 font-bold text-left">{item.date}</div><div className="font-bold text-stone-900 text-sm truncate text-left">{item.title}</div></div><button onClick={() => onDeleteNews(item.id)} className="p-3 text-stone-200 hover:text-red-500 transition-colors"><LucideIcon name="Trash2" size={20} /></button></div>))}</div></div></div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
