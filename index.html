<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T.K. SAXOPHONE | 傳承八十載的台灣匠心</title>
    <!-- 引入 Tailwind CSS -->

    <!-- 引入 React 核心與 Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Lucide 圖示 (全域版) -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100;300;400;700;900&display=swap');
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            overflow-x: hidden; 
            background-color: #fafaf9;
        }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        /* 捲軸美化 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f5f5f4; }
        ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 1. Firebase 初始化 ---
        const firebaseConfig = {
            apiKey: "AIzaSyCLedFsORsopOzUhtto5kr8WfEnM28Bh8k",
            authDomain: "tk-saxophone.firebaseapp.com",
            projectId: "tk-saxophone",
            storageBucket: "tk-saxophone.firebasestorage.app",
            messagingSenderId: "64364188077",
            appId: "1:64364188077:web:774938ea6f09f351c39124",
            measurementId: "G-VT59B60JMH"
        };
        const appId = 'tk-saxophone-web';

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        // --- 2. 穩定版圖示組件 ---
        const LucideIcon = ({ name, size = 24, className = "", ...props }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    const iconName = name.charAt(0).toLowerCase() + name.slice(1).replace(/[A-Z]/g, letter => `-${letter.toLowerCase()}`);
                    iconRef.current.setAttribute('data-lucide', iconName);
                    window.lucide.createIcons({
                        attrs: {
                            stroke: 'currentColor',
                            'stroke-width': 2,
                            width: size,
                            height: size,
                            class: className
                        }
                    });
                }
            }, [name, size, className]);
            return <i ref={iconRef} className={className} {...props}></i>;
        };

        // --- 3. 頁面組件定義 ---

        const HomePage = ({ onExplore }) => (
            <div className="animate-fade-in text-left">
                {/* 英雄視覺區 */}
                <section className="relative h-[85vh] flex items-center overflow-hidden">
                    <div className="absolute inset-0">
                        <img src="https://i.imgur.com/3jRKwrH.jpeg" alt="背景" className="w-full h-full object-cover shadow-2xl" />
                        <div className="absolute inset-0 bg-stone-950/40"></div>
                    </div>
                    <div className="relative max-w-7xl mx-auto px-6 w-full">
                        <div className="max-w-4xl space-y-8">
                            <div className="inline-block py-1 px-3 bg-amber-600 text-white text-[10px] font-black tracking-[0.4em] uppercase rounded shadow-lg">Since 1946 Legacy</div>
                            <h1 className="text-6xl md:text-8xl font-black text-white leading-[1.1] tracking-tighter italic drop-shadow-2xl uppercase">
                                T.K. SAXOPHONE<br /><span className="text-amber-500 text-4xl md:text-6xl block mt-4 font-black">傳承八十載的台灣匠心</span>
                            </h1>
                            <p className="text-xl text-stone-100 font-light max-w-2xl leading-relaxed drop-shadow-md">
                                「八十年，我們只專心做好一件事：製作能與靈魂共鳴的薩克斯風。」
                            </p>
                            <div className="flex gap-6 pt-4">
                                <button onClick={onExplore} className="px-10 py-5 bg-amber-600 text-white rounded-full font-black hover:bg-amber-700 transition shadow-2xl uppercase tracking-widest text-xs flex items-center gap-2 group">
                                    查看產品系列 <LucideIcon name="ChevronRight" size={18} className="group-hover:translate-x-1 transition" />
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                {/* 品牌簡介 */}
                <section className="py-24 bg-white">
                    <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-16 items-center">
                        <div className="space-y-8 text-left">
                            <h2 className="text-4xl font-black text-stone-900 italic tracking-tight uppercase text-left">品牌簡介</h2>
                            <p className="text-amber-600 font-bold tracking-widest text-sm italic border-l-4 border-amber-600 pl-4 uppercase font-black">來自台灣的匠人精神</p>
                            <p className="text-lg text-stone-600 leading-relaxed font-light text-left">
                                來自台灣的 <span className="font-bold text-stone-900 uppercase">T.K. SAXOPHONE</span>，擁有超過 <span className="font-bold text-amber-700">80 年</span> 的專業製造底蘊。我們將每一把樂器視為「感性」與「創造性」的完美結合。
                            </p>
                            <div className="grid grid-cols-2 gap-6 pt-4 text-left">
                                <div className="space-y-2">
                                    <div className="flex items-center gap-2 text-stone-900 font-bold uppercase text-sm"><LucideIcon name="Hammer" size={18} className="text-amber-600" /> 工藝底蘊</div>
                                    <p className="text-[10px] text-stone-400">跨越三代的製作技術。</p>
                                </div>
                                <div className="space-y-2">
                                    <div className="flex items-center gap-2 text-stone-900 font-bold uppercase text-sm"><LucideIcon name="Award" size={18} className="text-amber-600" /> 頂級選材</div>
                                    <p className="text-[10px] text-stone-400">嚴選進口優質黃銅。</p>
                                </div>
                            </div>
                        </div>
                        <img src="https://i.imgur.com/DTuYgcN.jpeg" className="rounded-[2rem] shadow-2xl transition duration-700 hover:scale-[1.01]" alt="TK 工藝" />
                    </div>
                </section>

                {/* 代言人展示區 */}
                <section className="py-24 bg-stone-900 text-white overflow-hidden text-left">
                    <div className="max-w-7xl mx-auto px-6 text-left">
                        <div className="text-center mb-20">
                            <h2 className="text-4xl font-black italic mb-4 tracking-tight text-white uppercase text-center">國際演奏家之選</h2>
                            <p className="text-stone-500 text-sm tracking-[0.2em] uppercase italic font-bold text-center">Trusted by World-Class Artists</p>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-12 text-left">
                            <div className="relative group bg-stone-800/50 rounded-[2.5rem] overflow-hidden flex flex-col shadow-2xl text-left">
                                <div className="h-[500px] w-full bg-stone-900">
                                    <img src="https://i.imgur.com/QsOg9vX.jpeg" alt="陳嘉俊" className="w-full h-full object-contain object-bottom transition duration-1000 group-hover:scale-105" />
                                </div>
                                <div className="absolute inset-x-0 bottom-0 p-10 bg-gradient-to-t from-stone-950 via-stone-950/60 to-transparent text-left">
                                    <h4 className="text-4xl font-black mb-4 italic uppercase text-left">陳嘉俊 (Wilson Chen)</h4>
                                    <p className="text-stone-300 font-light text-sm leading-relaxed text-left">其個人專屬「嘉」Model 系列在全球爵士圈享有盛譽。</p>
                                </div>
                            </div>
                            <div className="relative group bg-stone-800/50 rounded-[2.5rem] overflow-hidden flex flex-col shadow-2xl text-left">
                                <div className="h-[500px] w-full bg-stone-900">
                                    <img src="https://i.imgur.com/MgniwDh.jpeg" alt="小林香織" className="w-full h-full object-contain object-bottom transition duration-1000 group-hover:scale-105" />
                                </div>
                                <div className="absolute inset-x-0 bottom-0 p-10 bg-gradient-to-t from-stone-950 via-stone-950/60 to-transparent text-left">
                                    <h4 className="text-4xl font-black mb-4 italic uppercase text-left">小林香織 (Kaori Kobayashi)</h4>
                                    <p className="text-stone-300 font-light text-sm leading-relaxed text-left">多次巡迴演出指定使用 TK 系列產品，體現美感的完美結合。</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                {/* 工藝細節展示區 */}
                <section className="py-24 bg-white text-center">
                    <div className="max-w-7xl mx-auto px-6 mb-16 text-center">
                        <h2 className="text-4xl font-black italic mb-2 tracking-tight uppercase text-center">精緻工藝細節</h2>
                        <div className="w-16 h-1 bg-amber-500 mx-auto mt-4 text-center"></div>
                    </div>
                    <div className="max-w-5xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-8 text-center">
                        {[
                            "https://i.imgur.com/7h8Tm2w.jpeg",
                            "https://i.imgur.com/ub1b35l.jpeg",
                            "https://i.imgur.com/aN0jyY4.jpeg",
                            "https://i.imgur.com/mOrQ8ou.jpeg"
                        ].map((img, i) => (
                            <div key={i} className="aspect-[4/3] rounded-[2rem] overflow-hidden shadow-lg border border-stone-100 group">
                                <img src={img} className="w-full h-full object-cover group-hover:scale-110 transition duration-1000" alt={`Detail ${i+1}`} />
                            </div>
                        ))}
                    </div>
                </section>
            </div>
        );

        // 產品頁：移除價格顯示
        const ProductsPage = ({ products, loading }) => (
            <div className="max-w-7xl mx-auto px-6 py-20 animate-fade-in text-left min-h-[60vh]">
                <div className="text-center mb-16 text-center">
                    <h2 className="text-4xl font-black italic mb-4 tracking-tight uppercase text-stone-900 text-center">旗艦系列商品</h2>
                    <p className="text-stone-400 font-light italic text-center">精湛工藝，為專業演奏家打造。點擊按鈕前往商城查看詳情。</p>
                </div>
                {loading ? (
                    <div className="text-center py-20"><LucideIcon name="Loader2" className="animate-spin text-amber-500 mx-auto" size={48} /></div>
                ) : (
                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8 text-left">
                        {products.map((product) => (
                            <div key={product.id} className="bg-white rounded-[2rem] overflow-hidden border border-stone-100 shadow-sm hover:shadow-xl transition flex flex-col h-full group text-left">
                                <div className="aspect-square bg-stone-50 overflow-hidden relative">
                                    <img src={product.img} className="w-full h-full object-cover group-hover:scale-110 transition duration-700" alt={product.name} />
                                </div>
                                <div className="p-8 flex flex-col flex-1 text-left">
                                    <h3 className="font-bold text-sm mb-6 h-10 line-clamp-2 uppercase text-left leading-tight text-stone-800">{product.name}</h3>
                                    <a href={product.url} target="_blank" rel="noopener noreferrer" className="mt-auto w-full py-3 bg-stone-900 text-white rounded-xl text-[10px] font-black tracking-widest uppercase hover:bg-amber-600 transition flex items-center justify-center gap-2 shadow-lg">
                                        查看詳情 / 購買 <LucideIcon name="ExternalLink" size={14} />
                                    </a>
                                </div>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );

        const AboutSection = () => (
            <div className="max-w-5xl mx-auto px-6 py-24 animate-fade-in text-left">
                <div className="text-center mb-16 space-y-4 text-center">
                    <h2 className="text-5xl font-black italic mb-4 uppercase text-center">T.K. SAXOPHONE</h2>
                    <p className="text-amber-600 font-bold tracking-widest text-lg italic underline underline-offset-8 decoration-amber-500/30 text-center">傳承八十載的台灣匠心</p>
                </div>
                <div className="prose prose-stone max-w-none space-y-12 text-left">
                    <div className="bg-white p-10 rounded-[2.5rem] border border-stone-100 shadow-sm text-center">
                        <p className="text-2xl font-light italic uppercase leading-relaxed text-center text-stone-800">「八十年，我們只專心做好一件事：製作能與靈魂共鳴的薩克斯風。」</p>
                    </div>
                    <div className="grid md:grid-cols-2 gap-12 items-center mt-12 text-left">
                        <div className="space-y-6 text-left">
                            <p className="text-lg leading-relaxed text-left font-light text-stone-600">
                                來自台灣的 <span className="font-bold text-stone-900">T.K. SAXOPHONE</span>，擁有超過 <span className="font-bold text-amber-700">80 年</span> 的專業製造底蘊。我們堅持 100% 台灣製造與銷售，將每一把樂器視為「感性」與「創造性」的完美結合。
                            </p>
                        </div>
                        <img src="https://i.imgur.com/ub1b35l.jpeg" className="rounded-3xl shadow-xl" alt="關於 TK" />
                    </div>
                </div>
            </div>
        );

        const ServicePage = () => (
            <div className="max-w-4xl mx-auto px-6 py-20 text-center animate-fade-in text-center">
                <LucideIcon name="Shield" size={48} className="mx-auto text-amber-600 mb-6" />
                <h2 className="text-4xl font-black italic mb-12 uppercase text-stone-900 text-center">售後服務與保養</h2>
                <div className="bg-stone-900 text-white p-12 rounded-[3rem] shadow-2xl relative overflow-hidden max-w-2xl mx-auto text-center">
                    <p className="text-2xl font-black mb-4 tracking-widest italic underline decoration-amber-500 underline-offset-8 text-center text-white">0911-375938</p>
                    <p className="text-stone-400 font-light mb-12 uppercase text-[10px] font-bold tracking-widest text-center">專人服務：Easen</p>
                    <button className="px-10 py-4 bg-amber-600 rounded-full font-bold hover:bg-amber-700 transition tracking-widest uppercase text-xs mx-auto shadow-xl">預約專業維修校正</button>
                </div>
            </div>
        );

        // 管理員面板
        const AdminPanel = ({ onClose, appId, products, onDelete, notify, isCloudActive }) => {
            const [form, setForm] = useState({ name: '', price: '', img: '', url: '' });
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!isCloudActive) {
                    notify("同步失敗：雲端連線未啟動", "error");
                    return;
                }
                setIsSubmitting(true);
                try {
                    const db = firebase.firestore();
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products').add({
                        ...form, 
                        price: Number(form.price), 
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setForm({ name: '', price: '', img: '', url: '' });
                    notify("商品同步成功！", "success");
                } catch (err) { 
                    console.error(err);
                    notify("同步失敗，請檢查 API 設定與權限", "error"); 
                }
                setIsSubmitting(false);
            };

            return (
                <div className="max-w-4xl mx-auto px-6 py-20 animate-fade-in text-left min-h-[60vh]">
                    <div className="flex justify-between items-center mb-10 border-b pb-6 text-left">
                        <h2 className="text-2xl font-black italic uppercase text-stone-900 flex items-center gap-2 text-left">
                            <LucideIcon name="Settings" className="text-amber-600" /> 管理員中心
                        </h2>
                        <button onClick={onClose} className="text-xs font-bold border px-4 py-2 rounded-full uppercase tracking-widest hover:bg-stone-100 transition">返回網站</button>
                    </div>
                    
                    <div className="bg-white p-10 rounded-[2.5rem] border shadow-xl mb-12 text-left">
                        <h3 className="font-bold mb-6 italic border-l-4 border-amber-600 pl-4 text-stone-900 text-left">新增/同步商品</h3>
                        <form onSubmit={handleSubmit} className="grid md:grid-cols-2 gap-8 text-left">
                            <div className="space-y-2 text-left">
                                <label className="text-[10px] font-bold text-stone-400 uppercase tracking-widest text-left">商品名稱</label>
                                <input required value={form.name} onChange={e => setForm({...form, name: e.target.value})} className="w-full bg-stone-50 border p-4 rounded-2xl outline-none focus:ring-2 focus:ring-amber-500 transition" />
                            </div>
                            <div className="space-y-2 text-left">
                                <label className="text-[10px] font-bold text-stone-400 uppercase tracking-widest text-left">售價 (後台紀錄用)</label>
                                <input required type="number" value={form.price} onChange={e => setForm({...form, price: e.target.value})} className="w-full bg-stone-50 border p-4 rounded-2xl outline-none focus:ring-2 focus:ring-amber-500 transition" />
                            </div>
                            <div className="space-y-2 md:col-span-2 text-left">
                                <label className="text-[10px] font-bold text-stone-400 uppercase tracking-widest text-left">綠界科技收銀台 URL</label>
                                <input required value={form.url} onChange={e => setForm({...form, url: e.target.value})} className="w-full bg-stone-50 border p-4 rounded-2xl outline-none focus:ring-2 focus:ring-amber-500 transition" />
                            </div>
                            <div className="space-y-2 md:col-span-2 text-left">
                                <label className="text-[10px] font-bold text-stone-400 uppercase tracking-widest text-left">商品圖片連結</label>
                                <input required value={form.img} onChange={e => setForm({...form, img: e.target.value})} className="w-full bg-stone-50 border p-4 rounded-2xl outline-none focus:ring-2 focus:ring-amber-500 transition" />
                            </div>
                            <button disabled={isSubmitting || !isCloudActive} className="md:col-span-2 py-5 bg-stone-900 text-white rounded-2xl font-black uppercase text-xs hover:bg-amber-600 transition shadow-lg disabled:opacity-50 flex justify-center items-center gap-2">
                                {isSubmitting ? <LucideIcon name="Loader2" className="animate-spin" size={16} /> : <LucideIcon name="Save" size={16} />}
                                立即發佈至雲端
                            </button>
                        </form>
                    </div>

                    <div className="space-y-4 text-left">
                        <h3 className="font-bold mb-6 italic uppercase tracking-widest text-stone-900 text-left">線上商品管理 ({products.length})</h3>
                        <div className="grid gap-4 text-left">
                            {products.filter(p => !p.id.startsWith('default-')).map(p => (
                                <div key={p.id} className="bg-white p-4 rounded-[1.5rem] border border-stone-100 flex items-center justify-between group shadow-sm hover:shadow-md transition text-left">
                                    <div className="flex items-center gap-4 text-left">
                                        <img src={p.img} className="w-12 h-12 rounded-xl object-cover bg-stone-50" />
                                        <div className="text-left">
                                            <h4 className="font-bold text-sm uppercase text-left leading-tight text-stone-800">{p.name}</h4>
                                            <p className="text-[10px] text-stone-400 font-bold text-left italic">ID: {p.id}</p>
                                        </div>
                                    </div>
                                    <button onClick={() => onDelete(p.id)} className="p-3 text-stone-200 hover:text-red-500 transition-colors">
                                        <LucideIcon name="Trash2" size={20} />
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 4. App 進入點 ---
        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');
            const [showAdminIcon, setShowAdminIcon] = useState(false);
            const [adminClickCount, setAdminClickCount] = useState(0);
            const [products, setProducts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [statusMsg, setStatusMsg] = useState(null);
            const [isCloudActive, setIsCloudActive] = useState(false);

            const defaultProducts = [
                { id: 'default-1', name: 'TK.SAXOPHONE 傳奇中音 ALTO SAX', price: 72000, img: 'https://i.imgur.com/f3sTY2J.jpeg', url: 'https://t27v5glqel.cashier.ecpay.com.tw/product/000000000908931' },
                { id: 'default-2', name: 'TK.Saxophone 雅柏次中音 Tenor Sax', price: 120000, img: 'https://i.imgur.com/syUBobO.jpeg', url: 'https://t27v5glqel.cashier.ecpay.com.tw/product/000000000908930' }
            ];

            const notify = (text, type = 'info') => {
                setStatusMsg({ text, type });
                setTimeout(() => setStatusMsg(null), 3000);
            };

            const handleDeleteProduct = async (id) => {
                if (id.startsWith('default-')) {
                    notify("預設商品不可刪除", "error");
                    return;
                }
                try {
                    const db = firebase.firestore();
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products').doc(id).delete();
                    notify("商品已下架", "success");
                } catch (err) {
                    notify("刪除失敗，請檢查權限設定", "error");
                }
            };

            useEffect(() => {
                const init = async () => {
                    try {
                        await firebase.auth().signInAnonymously();
                        setIsCloudActive(true);
                        const db = firebase.firestore();
                        const productsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('products');
                        
                        return productsRef.onSnapshot(snap => {
                            const cloudList = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            const sortedList = cloudList.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                            setProducts(sortedList.length > 0 ? sortedList : defaultProducts);
                            setLoading(false);
                        }, err => {
                            setProducts(defaultProducts);
                            setLoading(false);
                            console.warn("使用預設商品清單運行中...");
                        });
                    } catch (e) {
                        setProducts(defaultProducts);
                        setLoading(false);
                    }
                };
                const unsubPromise = init();
                return () => unsubPromise.then(unsub => unsub && unsub());
            }, []);

            const handleAdminIconOpen = () => {
                const c = adminClickCount + 1;
                setAdminClickCount(c);
                if (c >= 3) {
                    setShowAdminIcon(true);
                    setAdminClickCount(0);
                    notify("管理後台入口已開啟");
                }
            };

                                </div>
                            </div>
                            <div className="hidden md:flex space-x-10 text-xs font-bold tracking-widest uppercase">
                                <button onClick={() => setCurrentPage('home')} className={currentPage === 'home' ? 'text-amber-500' : 'hover:text-stone-300 transition'}>首頁</button>

                                <button onClick={() => setCurrentPage('products')} className={currentPage === 'products' ? 'text-amber-500' : 'hover:text-stone-300 transition'}>產品系列</button>
                                <button onClick={() => setCurrentPage('service')} className={currentPage === 'service' ? 'text-amber-500' : 'hover:text-stone-300 transition'}>售後服務</button>
                            </div>
                            <div className="flex items-center gap-4">
                                <a href="https://t27v5glqel.cashier.ecpay.com.tw" target="_blank" className="p-2 hover:bg-stone-800 rounded-full transition flex items-center gap-2 text-xs font-bold border border-stone-700">
                                    <LucideIcon name="ShoppingCart" size={20} className="text-amber-500" />
                                    <span className="hidden sm:inline uppercase tracking-widest text-white font-black text-[10px]">線上商城</span>
                                </a>
                                {showAdminIcon && (
                                    <button onClick={() => setCurrentPage('admin')} className="p-2 bg-amber-600 rounded-full text-white shadow-lg animate-pulse">
                                        <LucideIcon name="Settings" size={20} />
                                    </button>
                                )}
                            </div>
                        </div>
                    </nav>

                    <main className="pt-20 flex-1">
                        {currentPage === 'home' && <HomePage onExplore={() => setCurrentPage('products')} />}
                        {currentPage === 'about' && <AboutSection />}
                        {currentPage === 'products' && <ProductsPage products={products} loading={loading} />}
                        {currentPage === 'service' && <ServicePage />}
                        {currentPage === 'admin' && (
                            <AdminPanel 
                                onClose={() => setCurrentPage('products')} 
                                appId={appId} 
                                products={products} 
                                notify={notify} 
                                isCloudActive={isCloudActive} 
                                onDelete={handleDeleteProduct}
                            />
                        )}
                    </main>

                    <footer className="bg-stone-950 text-stone-500 py-16 mt-auto">
                        <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-4 gap-12 text-left">
                            <div className="col-span-2 text-left leading-relaxed">
                                <div className="flex items-center gap-4 mb-6">
                                    <img src="https://i.imgur.com/H7NWyZP.png" alt="Logo" className="h-8 opacity-90" />
                                    <span className="text-xl font-bold tracking-widest text-white italic uppercase">TK SAXOPHONE</span>
                                </div>
                                <p className="text-sm max-w-sm text-left">八十年，我們只專心做好一件事：製作能與靈魂共鳴的薩克斯風。堅持 100% 台灣製造，守護匠人精神。</p>
                            </div>
                            <div className="text-left">
                                <h4 className="text-white font-bold text-sm tracking-widest uppercase mb-6 text-left">聯繫資訊</h4>
                                <p className="font-bold text-stone-300 italic underline underline-offset-4 mb-4 text-left">0911-375938 Easen</p>
                                <p className="flex items-start gap-2 text-xs text-left text-stone-500"><LucideIcon name="MapPin" size={14} className="text-amber-500 flex-shrink-0" /> 台中旗艦店</p>

                                    {isCloudActive ? '雲端同步啟動中' : '目前為離線展示模式'}
                                </div>
                                <p className="text-[10px] font-bold text-stone-600 uppercase italic mt-4 text-left">© 2024 TK MELODY SAXOPHONE.</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
